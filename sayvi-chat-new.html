<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#11161b">
<title>Сэйви · SEYVEO</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#11161b;color:#fff}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
main{height:100vh;height:100dvh;background:#11161b;display:flex;flex-direction:column;overflow:hidden}
header{height:calc(52px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 16px 0;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:590;letter-spacing:-.02em}

/* Тестовые сообщения: никакой поверхности и фона у области переписки. */
#sayviMessages{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:12px 16px 82px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
#sayviMessages::-webkit-scrollbar{display:none}
.turn{display:flex;flex-direction:column;gap:5px;margin:0 0 18px;font-size:15px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.turn[data-role="user"]{align-items:flex-end}
.turn[data-role="user"] .bubble{padding:9px 13px;border-radius:18px;background:#263039;max-width:85%}
.turn[data-role="assistant"] .bubble{max-width:100%}
.speaker{font-size:11px;color:#a5b0b7}
/* Независимые элементы в одной строке: никакой общей подложки. */
#sayviComposer{position:fixed;left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));bottom:calc(10px + env(safe-area-inset-bottom));display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;gap:8px;background:transparent;border:0;box-shadow:none;z-index:5}
#sayviField{display:block;position:relative;min-width:0;height:44px;background:transparent;border:0;box-shadow:none}
#sayviInput{display:block;width:100%;height:44px;min-height:44px;max-height:44px;box-sizing:border-box;margin:0;padding:10px 15px;border:0;border-radius:22px;background:#263039;color:#fff;box-shadow:none;outline:none;resize:none;font:400 16px/24px -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-appearance:none;appearance:none}
#sayviInput::placeholder{color:#a5b0b7;opacity:1}
#sayviMic,#sayviSend,#sayviPlus{position:static;display:grid;place-items:center;width:44px;height:44px;min-width:44px;margin:0;padding:0;border:0;border-radius:50%;background:#263039;color:#fff;box-shadow:none;outline:0;-webkit-appearance:none;appearance:none}
#sayviMic{font-size:24px;line-height:1}
#sayviSend[hidden]{display:none!important}
#sayviSend svg,#sayviPlus svg{display:block;width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#sayviMenu{z-index:6}
#sayviMenu[hidden]{display:none}
#sayviMenu{position:fixed;left:max(12px,env(safe-area-inset-left));bottom:calc(62px + env(safe-area-inset-bottom));min-width:175px;padding:5px;border-radius:15px;background:#263039}
#sayviMenu button{display:block;width:100%;border:0;border-radius:10px;background:transparent;color:#fff;padding:11px 12px;text-align:left;font:inherit}
#sayviMenu button:active{background:rgba(255,255,255,.08)}
</style>
</head>
<body>
<main>
<header>Сэйви</header>
<div id="sayviMessages" role="log" aria-label="Переписка"></div>
<div id="sayviComposer">
<button id="sayviPlus" type="button" aria-label="Дополнительные действия" aria-expanded="false" aria-controls="sayviMenu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
<div id="sayviField"><textarea id="sayviInput" rows="1" aria-label="Сообщение Сэйви" placeholder="Сообщение Сэйви"></textarea></div>
<button id="sayviMic" type="button" aria-label="Голосовой ввод">🎙️</button>
<button id="sayviSend" type="button" aria-label="Отправить сообщение" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5m0 0-6 6m6-6 6 6"/></svg></button>
</div>
<div id="sayviMenu" hidden><button type="button" id="sayviNewChat">Новый разговор</button></div>
</main>
<script>
(()=>{
 const input=document.getElementById('sayviInput'),list=document.getElementById('sayviMessages');
 const mic=document.getElementById('sayviMic'),sendButton=document.getElementById('sayviSend');
 function updateControls(){const typed=!!input.value.trim();sendButton.hidden=!typed;mic.hidden=typed}
 input.addEventListener('input',updateControls);
 function append(role,message){
  const turn=document.createElement('div');turn.className='turn';turn.dataset.role=role;
  if(role==='assistant'){const title=document.createElement('span');title.className='speaker';title.textContent='Сэйви';turn.append(title);}
  const bubble=document.createElement('div');bubble.className='bubble';bubble.textContent=message;turn.append(bubble);list.append(turn);
  list.scrollTop=list.scrollHeight;
 }
 function send(){
  const value=input.value.trim();if(!value)return;
  input.value='';updateControls();
  append('user',value);
  append('assistant','Вижу твоё сообщение. Это локальная проверка: сейчас мы смотрим, не появляется ли фон за нижним полем, когда переписка становится длиннее. Можно написать ещё несколько сообщений и прокрутить чат вверх.');
 }
 const plus=document.getElementById('sayviPlus'),menu=document.getElementById('sayviMenu');
 function closeMenu(){menu.hidden=true;plus.setAttribute('aria-expanded','false')}
 plus.addEventListener('click',()=>{menu.hidden=!menu.hidden;plus.setAttribute('aria-expanded',String(!menu.hidden))});
 document.getElementById('sayviNewChat').addEventListener('click',()=>{list.replaceChildren();input.value='';updateControls();closeMenu();input.focus()});
 document.addEventListener('pointerdown',event=>{if(!menu.hidden&&!event.target.closest('#sayviPlus,#sayviMenu'))closeMenu()});
 sendButton.addEventListener('click',send);
 mic.addEventListener('click',()=>{
  const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!Recognition)return;
  try{
   const session=new Recognition();session.lang='ru-RU';session.interimResults=false;
   session.onresult=e=>{input.value=[input.value,e.results[0][0].transcript].filter(Boolean).join(' ');updateControls();input.focus()};
   session.start();
  }catch{}
 });
 updateControls();
 input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}});
})();
</script>
</body>
</html>
