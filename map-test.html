<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>SEYVEO · Тест карты</title>
<style>
:root{color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:#17191d;background:#f5f6f8}
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px}
main{width:100%;max-width:420px;background:#fff;border:1px solid #e3e6eb;border-radius:24px;padding:24px}
small{color:#68717d;font-weight:600;letter-spacing:.08em}h1{font-size:24px;margin:12px 0}p{font-size:15px;line-height:1.55;color:#535d69}
label{display:block;margin:22px 0 8px;font-size:14px;font-weight:600}
input{width:100%;min-height:48px;border:1px solid #d8dde5;border-radius:14px;background:#f5f6f8;padding:12px;font:inherit}
button,a{min-height:44px;font:600 15px/1.3 inherit}
button{width:100%;font-family:inherit;font-size:15px;font-weight:600;border:0;border-radius:999px;cursor:pointer;padding:12px;margin-top:12px}
.primary{background:#b9dfff;color:#0759a3}.secondary{background:#edf0f3;color:#29313c}
a{display:flex;align-items:center;justify-content:center;color:#007aff;text-decoration:none;margin-top:10px}
#status{min-height:20px;color:#a35e20;font-size:13px}
#preview{width:100%;height:280px;margin:12px 0;border-radius:14px;overflow:hidden;background:#edf0f3}#preview[hidden]{display:none}#status{overflow-wrap:anywhere}
</style>
</head>
<body>
<main>
<small>SEYVEO MAPS · V80</small>
<h1>Проверка Яндекс Карт</h1>
<p>Отдельный тест SDK без окна встречи, без OpenStreetMap и без оформления SEYVEO. Ключ уже настроен в приложении.</p>
<button type="button" class="primary" id="diagnose">Проверить Яндекс</button>
<p id="status" role="status" aria-live="polite">Готов к проверке.</p>
<div id="preview" hidden></div>
<p id="details" style="white-space:pre-wrap;overflow-wrap:anywhere"></p>
<a href="./index.html#tasks">Вернуться в SEYVEO</a>
</main>
<script src="assets/seyveo-yandex-map.js?v=20261126-map-v80"></script>
<script>
(function(){
 'use strict';
 const status=document.getElementById('status'),details=document.getElementById('details'),preview=document.getElementById('preview'),button=document.getElementById('diagnose');
 let map=null;
 function log(value){details.textContent+=(details.textContent?'\n':'')+value}
 document.addEventListener('securitypolicyviolation',event=>{
  let host=event.blockedURI;
  try{host=new URL(host).hostname}catch{if(!['inline','eval','data','blob'].includes(host))host='ресурс'}
  log('CSP: '+event.effectiveDirective+' · '+host);
 });
 button.addEventListener('click',async()=>{
  button.disabled=true;details.textContent='';status.textContent='Загрузка SDK…';
  log('Адрес: '+location.origin);log('Ключ: '+(window.SEYVEO_YANDEX_MAPS?.enabled()?'подключён':'отсутствует'));
  if(map){try{map.destroy()}catch{}map=null}
  preview.replaceChildren();preview.hidden=true;
  try{
   const sdk=await window.SEYVEO_YANDEX_MAPS.loadSdk();
   log('SDK: готов');preview.hidden=false;
   map=new sdk.YMap(preview,{location:{center:[38.984,45.101],zoom:15}});
   map.addChild(new sdk.YMapDefaultSchemeLayer());
   log('Стандартный слой: создан');
   status.textContent='Карта создана. Проверь, появились ли улицы и логотип Яндекса.';
  }catch{
   status.textContent='Ошибка подключения';
   log('Этап: '+(window.SEYVEO_YANDEX_MAPS?.status()||'модуль недоступен'));
   if(window.SEYVEO_YANDEX_MAPS?.status()==='sdk-ready')log('Ошибка создания базовой карты');
  }finally{button.disabled=false}
 });
})();
</script>
</body>
</html>
