<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#11161b">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Сэйви · SEYVEO</title>
<style>
:root{color-scheme:dark;--canvas:#11161b;--ink:#f5f7f9;--muted:#a5b0b7}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;min-height:0;overflow:hidden;background:var(--canvas);color:var(--ink)}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;-webkit-tap-highlight-color:transparent}
main{position:fixed;top:var(--chat-viewport-top,0px);left:0;width:100%;height:var(--chat-viewport-height,100dvh);min-height:0;overflow:hidden;background:var(--canvas);display:flex;flex-direction:column}
.chat-head{height:calc(56px + env(safe-area-inset-top));padding:env(safe-area-inset-top) max(12px,env(safe-area-inset-right)) 0 max(12px,env(safe-area-inset-left));display:grid;grid-template-columns:48px minmax(0,1fr) 48px;align-items:center;gap:4px;flex:none}
.chat-head button{display:grid;place-items:center;width:44px;height:44px;padding:0;margin:0;border:0;border-radius:16px;color:var(--ink);background:transparent;cursor:pointer;transition:background-color .16s ease}
.chat-head button:hover{background:rgba(227,237,244,.065)}
.chat-head button:active{background:rgba(227,237,244,.11)}
.chat-head button:focus-visible,.sheet-close:focus-visible{outline:2px solid rgba(210,229,237,.65);outline-offset:2px}
.chat-head svg,.sheet-close svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}
.chat-title{min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:16px;font-weight:590;letter-spacing:-.025em;line-height:21px}
.chat-typing[hidden]{display:none!important}
.chat-typing{height:8px;display:flex;align-items:center;gap:4px;margin-top:3px}
.chat-typing i{width:3px;height:3px;border-radius:50%;background:#b2c1cb;animation:sayvi-pulse 1.1s ease-in-out infinite}
.chat-typing i:nth-child(2){animation-delay:.15s}
.chat-typing i:nth-child(3){animation-delay:.3s}
@keyframes sayvi-pulse{0%,65%,100%{opacity:.35;transform:translateY(0)}32%{opacity:1;transform:translateY(-2px)}}
.chat-space{flex:1;min-height:0;display:flex;flex-direction:column;width:100%;overflow:hidden}
.chat-thread{flex:1 1 0;min-height:0;height:0;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;overscroll-behavior-y:contain;overflow-anchor:none;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:12px max(16px,env(safe-area-inset-right)) 28px max(16px,env(safe-area-inset-left))}
.chat-thread::-webkit-scrollbar{display:none}
.chat-turns{display:flex;flex-direction:column;flex-shrink:0;height:max-content;gap:21px;width:100%;max-width:720px;margin:0 auto;min-height:100%}
.chat-turn{display:flex;flex-direction:column;flex:0 0 auto;gap:7px;min-width:0;max-width:100%;font-size:15px;line-height:1.55;letter-spacing:-.008em}
.chat-turn[data-role="assistant"]{align-items:flex-start}
.chat-turn[data-role="user"]{align-items:flex-end}
.chat-speaker{font-size:11px;font-weight:550;letter-spacing:.01em;color:var(--muted);padding:0 3px}
.chat-turn[data-role="user"] .chat-speaker{display:none}
.chat-message{max-width:min(100%,620px);white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink)}
.chat-turn[data-role="user"] .chat-message{max-width:min(86%,460px);padding:10px 14px;border-radius:18px;background:#263039;color:#f5f7f9}
.chat-turn[data-role="assistant"] .chat-message{padding:0 3px;background:transparent;border:0;box-shadow:none}
.chat-empty{margin:auto;align-self:center;color:#89969e;font-size:14px;font-weight:450;text-align:center;letter-spacing:-.01em}
@media(max-width:420px){.chat-thread{padding-top:8px;padding-bottom:22px}.chat-turns{gap:18px}}

.composer{position:relative;flex:none;width:100%;padding:6px max(10px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));background:transparent}
.composer-inner{width:100%;max-width:720px;margin:auto;display:grid;grid-template-columns:42px minmax(0,1fr);align-items:end;gap:9px}
.composer-capsule{min-width:0;display:grid;grid-template-columns:minmax(0,1fr) 40px;align-items:end;padding:1px 2px 1px 1px;border:0;border-radius:23px;background:linear-gradient(171deg,rgba(236,247,252,.115) 0%,rgba(182,204,216,.045) 37%,rgba(177,197,210,.018) 76%),rgba(38,49,58,.39);-webkit-backdrop-filter:blur(24px) saturate(1.13);backdrop-filter:blur(24px) saturate(1.13);box-shadow:inset 0 1px 0 rgba(241,250,255,.075)}
.composer-btn{width:40px;height:40px;display:grid;place-items:center;align-self:end;appearance:none;border:0;border-radius:50%;background:transparent;color:var(--ink);padding:0;cursor:pointer}
.composer-btn svg{width:21px;height:21px;stroke:currentColor;stroke-width:1.55;stroke-linecap:round;stroke-linejoin:round;fill:none}
#plus{width:42px;height:42px;background:linear-gradient(165deg,rgba(233,244,250,.105),rgba(181,206,216,.025) 72%),rgba(40,51,59,.36);-webkit-backdrop-filter:blur(22px) saturate(1.12);backdrop-filter:blur(22px) saturate(1.12);box-shadow:inset 0 1px 0 rgba(241,250,255,.065)}
.composer-btn:hover{background-color:rgba(230,240,245,.075)}
.composer-btn:focus-visible{outline:2px solid rgba(208,226,236,.65);outline-offset:2px}
.composer-text:focus,.composer-text:focus-visible{outline:none!important;box-shadow:none!important}
.composer-capsule:focus-within{outline:none;border-color:transparent;box-shadow:inset 0 1px 0 rgba(241,250,255,.075)}
.composer-btn[disabled]{opacity:.35;cursor:not-allowed}
.composer-text{width:100%;min-width:0;max-height:132px;min-height:40px;resize:none;display:block;overflow-y:auto;scrollbar-width:none;padding:9px 9px 9px 14px;border:0;border-radius:21px;background:transparent;box-shadow:none;color:var(--ink);font:400 16px/22px -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;outline:0}
.composer-text::placeholder{color:var(--muted);opacity:1}
.composer-send[hidden],.composer-mic[hidden],.composer-stop[hidden],.composer-menu[hidden]{display:none!important}
.composer-menu{position:absolute;bottom:calc(100% + 3px);left:max(14px,env(safe-area-inset-left));width:200px;padding:5px;border-radius:18px;background:rgba(39,52,60,.95);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.composer-menu button{display:block;width:100%;padding:12px 14px;border:0;background:transparent;color:var(--ink);text-align:left;font:inherit;font-size:14px;border-radius:12px}
.composer-menu button:focus-visible,.composer-menu button:hover{background:rgba(255,255,255,.085)}
.composer-status{max-width:720px;margin:3px auto 0;padding:0 6px;color:var(--muted);font-size:12px;min-height:0}
.composer-status:empty{display:none}
.sheet[hidden]{display:none}
.sheet{position:fixed;inset:0;z-index:10;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.38)}
.sheet-panel{width:100%;max-width:600px;min-height:230px;max-height:80dvh;overflow:auto;padding:12px 20px calc(30px + env(safe-area-inset-bottom));border-radius:25px 25px 0 0;background:rgba(37,48,56,.93);-webkit-backdrop-filter:blur(22px) saturate(1.15);backdrop-filter:blur(22px) saturate(1.15);box-shadow:0 -8px 36px rgba(0,0,0,.12)}
.sheet-handle{width:35px;height:4px;border-radius:8px;margin:0 auto 13px;background:rgba(226,236,241,.3)}
.sheet-top{display:grid;grid-template-columns:44px 1fr 44px;align-items:center}
.sheet-top h2{font-size:16px;font-weight:600;letter-spacing:-.02em;margin:0;text-align:center}
.sheet-close{grid-column:3;grid-row:1;display:grid;place-items:center;width:44px;height:44px;border:0;border-radius:14px;background:transparent;color:var(--ink)}
.sheet p{text-align:center;color:var(--muted);font-size:14px;margin:42px 0 24px}
@media(prefers-reduced-motion:reduce){.chat-head button{transition:none}.chat-typing i{animation:none;opacity:.7}}
</style>
</head>
<body>
<main>
 <header class="chat-head" aria-label="Панель чата">
  <button type="button" id="back" aria-label="Вернуться на Главную" title="Назад"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14.5 5-7 7 7 7"/></svg></button>
  <div class="chat-title"><span>Сэйви</span><span class="chat-typing" id="chatTyping" role="status" aria-label="Сэйви печатает" hidden><i></i><i></i><i></i></span></div>
  <button type="button" id="history" aria-label="История бесед" title="История"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 5v5h5M5 10a7.5 7.5 0 1 1 .4 5.1M12 8v4.2l2.7 1.8"/></svg></button>
 </header>
 <section class="chat-space" aria-label="Сообщения">
  <div class="chat-thread" id="chatThread" role="log" aria-label="Переписка с Сэйви" aria-live="polite" aria-relevant="additions text">
   <div class="chat-turns" id="chatTurns">
    <p class="chat-empty" id="chatEmpty" hidden></p>
   </div>
  </div>
 </section>
 <form class="composer" id="composer" autocomplete="off">
  <div class="composer-menu" id="composerMenu" hidden>
   <button type="button" id="newConversation">Новый разговор</button>
   <button type="button" id="pasteText">Вставить текст</button>
  </div>
  <div class="composer-inner">
   <button class="composer-btn" id="plus" type="button" aria-label="Дополнительные действия" aria-expanded="false" aria-controls="composerMenu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
   <div class="composer-capsule">
    <textarea class="composer-text" id="messageInput" rows="1" maxlength="4000" placeholder="Сообщение Сэйви" aria-label="Написать Сэйви"></textarea>
    <button class="composer-btn composer-mic" id="microphone" type="button" aria-label="Голосовой ввод"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4M8.5 21h7"/></svg></button>
    <button class="composer-btn composer-send" id="sendMessage" type="submit" aria-label="Отправить сообщение" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5m0 0-6 6m6-6 6 6"/></svg></button>
    <button class="composer-btn composer-stop" id="stopMessage" type="button" aria-label="Остановить ответ" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="2"/></svg></button>
   </div>
  </div>
  <div class="composer-status" id="composerStatus" role="status" aria-live="polite"></div>
 </form>
</main>
<div class="sheet" id="historySheet" hidden>
 <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="historyHeading">
  <div class="sheet-handle" aria-hidden="true"></div>
  <div class="sheet-top"><h2 id="historyHeading">История</h2><button type="button" class="sheet-close" id="closeHistory" aria-label="Закрыть историю"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
  <p>Здесь появятся ваши беседы с Сэйви.</p>
 </div>
</div>
<script>
(()=>{
 const viewport=window.visualViewport;
 function fitChatViewport(){
  // Keep the composer within the *visible* screen, including iOS keyboard.
  const height=Math.round(viewport?.height||window.innerHeight);
  const top=Math.round(viewport?.offsetTop||0);
  document.documentElement.style.setProperty('--chat-viewport-height',height+'px');
  document.documentElement.style.setProperty('--chat-viewport-top',top+'px');
 }
 fitChatViewport();
 window.addEventListener('resize',fitChatViewport);
 viewport?.addEventListener('resize',fitChatViewport);
 viewport?.addEventListener('scroll',fitChatViewport);
 const thread=document.getElementById('chatThread');
 const turns=document.getElementById('chatTurns');
 const empty=document.getElementById('chatEmpty');
 // A new message renderer owned only by this page. No old chat DOM/CSS is reused.
 const messages=new Map();
 function appendMessage({id,role,text}={}){
  if(role!=='user'&&role!=='assistant')return null;
  const key=String(id||('msg-'+(messages.size+1)));
  let entry=messages.get(key);
  const nearBottom=thread.scrollHeight-thread.scrollTop-thread.clientHeight<80;
  if(!entry){
   const node=document.createElement('article');
   node.className='chat-turn';
   node.dataset.role=role;
   const content=document.createElement('div');
   content.className='chat-message';
   if(role==='assistant'){
    const speaker=document.createElement('span');
    speaker.className='chat-speaker';speaker.textContent='Сэйви';
    node.append(speaker);
   }
   node.append(content);
   entry={node,content,role};
   messages.set(key,entry);
   turns.appendChild(node);
  }
  if(entry.role!==role)return null;
  entry.content.textContent=String(text??'');
  empty.hidden=messages.size>0;
  if(nearBottom)requestAnimationFrame(()=>{thread.scrollTop=thread.scrollHeight-thread.clientHeight});
  return key;
 }
 window.SEYVEO_NEW_CHAT_UI=Object.freeze({
  appendMessage,
  clear(){
   for(const entry of messages.values())entry.node.remove();
   messages.clear();empty.hidden=true;
  }
 });

 const composer=document.getElementById('composer');
 const input=document.getElementById('messageInput');
 const plus=document.getElementById('plus');
 const menu=document.getElementById('composerMenu');
 const mic=document.getElementById('microphone');
 const send=document.getElementById('sendMessage');
 const stop=document.getElementById('stopMessage');
 const info=document.getElementById('composerStatus');
 const typing=document.getElementById('chatTyping');
 const historyTurns=[];
 let pending=null,sequence=0,recognition=null;
 function syncComposer(){
  input.style.height='40px';
  input.style.height=Math.min(132,Math.max(40,input.scrollHeight))+'px';
  mic.hidden=!!pending||!!input.value.trim();
  send.hidden=!!pending||!input.value.trim();
  stop.hidden=!pending;
 }
 function toggleMenu(force){
  menu.hidden=typeof force==='boolean'?!force:!menu.hidden;
  plus.setAttribute('aria-expanded',String(!menu.hidden));
 }
 plus.addEventListener('click',()=>toggleMenu());
 document.getElementById('newConversation').addEventListener('click',()=>{
  if(pending){pending.abort();pending=null}
  window.SEYVEO_NEW_CHAT_UI.clear();historyTurns.length=0;input.value='';info.textContent='';
  toggleMenu(false);syncComposer();input.focus();
 });
 document.getElementById('pasteText').addEventListener('click',async()=>{
  toggleMenu(false);
  try{
   const value=await navigator.clipboard.readText();
   input.value=(input.value+value).slice(0,4000);
   syncComposer();input.focus();
  }catch{info.textContent='Вставь текст обычной командой Ctrl+V.'}
 });
 input.addEventListener('input',syncComposer);
 input.addEventListener('keydown',event=>{
  if(event.key==='Enter'&&!event.shiftKey&&!event.isComposing){
   event.preventDefault();composer.requestSubmit();
  }
 });
 function setBusy(controller){pending=controller;input.disabled=!!controller;typing.hidden=!controller;syncComposer()}
 stop.addEventListener('click',()=>{pending?.abort()});
 async function ask(question){
  const controller=new AbortController();
  const id=++sequence;
  const replyId='sayvi-'+id;
  appendMessage({id:'you-'+id,role:'user',text:question});
  setBusy(controller);info.textContent='';
  let answer='',done=false;
  try{
   const response=await fetch('/api/seyveo-stream',{
    method:'POST',credentials:'same-origin',
    headers:{'content-type':'application/json'},
    body:JSON.stringify({message:question,history:historyTurns.slice(-6)}),
    signal:controller.signal
   });
   if(!response.ok){
    const payload=await response.json().catch(()=>({}));
    throw Error(payload.error||'Не удалось получить ответ Сэйви.');
   }
   if(!response.body)throw Error('Этот браузер не поддерживает потоковый ответ.');
   const reader=response.body.getReader();
   const decoder=new TextDecoder();
   let buffer='';
   const consume=line=>{
    if(!line.trim())return;
    const part=JSON.parse(line);
    if(part.type==='delta'&&typeof part.text==='string'){
     answer+=part.text;appendMessage({id:replyId,role:'assistant',text:answer});
    }else if(part.type==='done'){done=true}
    else if(part.type==='error')throw Error(part.text||'Ответ прервался.');
   };
   while(true){
    const chunk=await reader.read();if(chunk.done)break;
    buffer+=decoder.decode(chunk.value,{stream:true});
    let index;
    while((index=buffer.indexOf('\n'))!==-1){
     consume(buffer.slice(0,index));buffer=buffer.slice(index+1);
    }
   }
   buffer+=decoder.decode();
   if(buffer.trim())consume(buffer);
   if(!done)throw Error('Соединение прервалось.');
   if(!answer.trim())throw Error('Сэйви не прислала ответ.');
   historyTurns.push({role:'user',content:question.slice(0,250)},{role:'assistant',content:answer.slice(0,450)});
   if(historyTurns.length>12)historyTurns.splice(0,historyTurns.length-12);
  }catch(error){
   const cancelled=controller.signal.aborted;
   appendMessage({id:replyId,role:'assistant',text:answer||(cancelled?'Ответ остановлен.':'Не удалось получить ответ.')});
   if(!cancelled)info.textContent=String(error?.message||'Ошибка соединения.');
  }finally{
   if(pending===controller){setBusy(null)}
  }
 }
 composer.addEventListener('submit',event=>{
  event.preventDefault();
  const value=input.value.trim();
  if(!value||pending)return;
  input.value='';syncComposer();ask(value);
 });
 mic.addEventListener('click',()=>{
  const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!Recognition){info.textContent='Голосовой ввод недоступен в этом браузере.';return}
  if(recognition){recognition.stop();return}
  const instance=new Recognition();
  recognition=instance;instance.lang='ru-RU';instance.interimResults=false;instance.maxAlternatives=1;
  instance.onresult=event=>{
   const said=event.results?.[0]?.[0]?.transcript||'';
   input.value=(input.value+' '+said).trim().slice(0,4000);syncComposer();
  };
  instance.onerror=event=>{info.textContent=event.error==='not-allowed'?'Разреши доступ к микрофону.':'Не удалось распознать речь.'};
  instance.onend=()=>{recognition=null;mic.setAttribute('aria-pressed','false')};
  try{instance.start();mic.setAttribute('aria-pressed','true');info.textContent='Слушаю…'}catch{recognition=null;info.textContent='Микрофон недоступен.'}
 });
 document.addEventListener('click',event=>{
  if(!menu.hidden&&!event.target.closest('#composerMenu,#plus'))toggleMenu(false);
 });
 syncComposer();
 const sheet=document.getElementById('historySheet');
 const trigger=document.getElementById('history');
 const close=document.getElementById('closeHistory');
 document.getElementById('back').addEventListener('click',()=>{window.location.assign('./')});
 function hide(){sheet.hidden=true;trigger.focus()}
 trigger.addEventListener('click',()=>{sheet.hidden=false;close.focus()});
 close.addEventListener('click',hide);
 sheet.addEventListener('click',e=>{if(e.target===sheet)hide()});
 document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!sheet.hidden)hide()});
})();
</script>
</body>
</html>
