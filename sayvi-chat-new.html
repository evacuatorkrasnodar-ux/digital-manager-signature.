<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Сэйви · SEYVEO</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#000;color:#fff}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
main{height:100vh;height:100dvh;background:#000;display:flex;flex-direction:column;overflow:hidden}
header{height:calc(52px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 16px 0;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:590;letter-spacing:-.02em}

/* Тестовые сообщения: никакой поверхности и фона у области переписки. */
#sayviMessages{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:12px 16px 82px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
#sayviMessages::-webkit-scrollbar{display:none}
.turn{display:flex;flex-direction:column;gap:5px;margin:0 0 18px;font-size:15px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.turn[data-role="user"]{align-items:flex-end}
.turn[data-role="user"] .bubble{padding:9px 13px;border-radius:18px;background:#263039;max-width:85%}
.turn[data-role="assistant"] .bubble{max-width:100%}
.speaker{font-size:11px;color:#a5b0b7}
/* Только поле ввода — без контейнера, подложки и размытия. */
#sayviInput{position:fixed;left:max(12px,env(safe-area-inset-left));bottom:calc(10px + env(safe-area-inset-bottom));width:calc(100% - max(12px,env(safe-area-inset-left)) - max(60px,env(safe-area-inset-right)));height:44px;min-height:44px;max-height:44px;box-sizing:border-box;display:block;margin:0;padding:10px 15px;border:0;border-radius:22px;background:#263039;color:#fff;box-shadow:none;outline:none;resize:none;font:400 16px/24px -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-appearance:none;appearance:none}
#sayviInput::placeholder{color:#a5b0b7;opacity:1}
#sayviSend{position:fixed;right:max(12px,env(safe-area-inset-right));bottom:calc(10px + env(safe-area-inset-bottom));width:44px;height:44px;display:grid;place-items:center;border:0;border-radius:50%;background:#263039;color:#fff;padding:0}
#sayviSend svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>
<main>
<header>Сэйви</header>
<div id="sayviMessages" role="log" aria-label="Переписка"></div>
<textarea id="sayviInput" rows="1" aria-label="Сообщение Сэйви" placeholder="Сообщение Сэйви"></textarea>
<button id="sayviSend" type="button" aria-label="Отправить сообщение"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5m0 0-6 6m6-6 6 6"/></svg></button>
</main>
<script>
(()=>{
 const input=document.getElementById('sayviInput'),list=document.getElementById('sayviMessages');
 function append(role,message){
  const turn=document.createElement('div');turn.className='turn';turn.dataset.role=role;
  if(role==='assistant'){const title=document.createElement('span');title.className='speaker';title.textContent='Сэйви';turn.append(title);}
  const bubble=document.createElement('div');bubble.className='bubble';bubble.textContent=message;turn.append(bubble);list.append(turn);
  list.scrollTop=list.scrollHeight;
 }
 function send(){
  const value=input.value.trim();if(!value)return;
  input.value='';
  append('user',value);
  append('assistant','Вижу твоё сообщение. Это локальная проверка: сейчас мы смотрим, не появляется ли фон за нижним полем, когда переписка становится длиннее. Можно написать ещё несколько сообщений и прокрутить чат вверх.');
 }
 document.getElementById('sayviSend').addEventListener('click',send);
 input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}});
})();
</script>
</body>
</html>
