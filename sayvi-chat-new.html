<script>
/* Read the same persisted theme as the SEYVEO Home before first paint. */
(function(){
 const key='dm-signature-living-v2';
 const previous='dm-signature-living-v1';
 const allowed=['auto','graphite','light','dark','sapphire','plum'];
 const browserTheme=window.matchMedia('(prefers-color-scheme: dark)');
 function chosen(){
  let value='graphite';
  try{
   const saved=JSON.parse(localStorage.getItem(key)||'null')
    ||JSON.parse(localStorage.getItem(previous)||'null');
   if(saved&&allowed.includes(saved.theme))value=saved.theme;
  }catch{}
  return value==='auto'?(browserTheme.matches?'graphite':'light'):value;
 }
 function sync(){
  const selected=chosen(),isLight=selected==='light';
  const palette=isLight?'white':selected==='graphite'?'graphite':selected==='sapphire'?'sapphire':selected==='plum'?'plum':'emerald';
  document.documentElement.dataset.theme=isLight?'light':'dark';
  document.documentElement.dataset.palette=palette;
  document.querySelector('meta[name="theme-color"]').content=
   isLight?'#f9fafb':palette==='graphite'?'#11161b':palette==='sapphire'?'#101724':palette==='plum'?'#1c1b1a':'#111917';
 }
 sync();
 window.addEventListener('storage',e=>{if(!e.key||e.key===key||e.key===previous)sync()});
 window.addEventListener('pageshow',sync);
 window.addEventListener('focus',sync);
 document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});
 if(browserTheme.addEventListener)browserTheme.addEventListener('change',sync);
 else if(browserTheme.addListener)browserTheme.addListener(sync);
})();
</script>

/* Same SEYVEO theme system as Home; only colors/materials change.
   No alterations to composer dimensions, behavior or message scrolling. */
:root{
 --sayvi-bg:#11161b;

 --sayvi-text:#fff;
 --sayvi-secondary:#a5b0b7;
 --sayvi-bubble:#263039;
 /* Flat neutral smoke on all dark palettes, not a blue/green gradient.
    The blurred background remains visible through the material. */
 --sayvi-glass:rgba(184,195,201,.19);
 --sayvi-action:rgba(184,195,201,.19);
 --sayvi-control-text:#f7fafc;
 --sayvi-placeholder:rgba(228,235,241,.70);

<script>
(()=>{
 'use strict';
 const input=document.getElementById('sayviInput'),list=document.getElementById('sayviMessages');
 // Keep the full-screen scene aligned to the visible viewport on iOS Safari.
 // Only the messages scroll; composer/menu remain anchored to the scene.
 const scene=document.querySelector('main');
 let viewportFrame=0;
 function fitVisibleViewport(){
  if(viewportFrame)return;
  viewportFrame=requestAnimationFrame(()=>{
   viewportFrame=0;
   const vv=window.visualViewport;
   if(vv){
    scene.style.setProperty('--sayvi-viewport-top',vv.offsetTop+'px');
    scene.style.setProperty('--sayvi-viewport-height',vv.height+'px');
   }else{
    scene.style.setProperty('--sayvi-viewport-top','0px');
    scene.style.setProperty('--sayvi-viewport-height',window.innerHeight+'px');
   }
  });
 }
 fitVisibleViewport();
 window.visualViewport?.addEventListener('resize',fitVisibleViewport,{passive:true});
 window.visualViewport?.addEventListener('scroll',fitVisibleViewport,{passive:true});
 window.addEventListener('resize',fitVisibleViewport,{passive:true});
 // Fade older messages only after scrolling; the first visible line stays crisp.
 const updateScrollEdge=()=>list.classList.toggle('is-scrolled',list.scrollTop>2);
 list.addEventListener('scroll',updateScrollEdge,{passive:true});
 const mic=document.getElementById('sayviMic'),sendButton=document.getElementById('sayviSend');
 const stopReplyButton=document.getElementById('sayviStopReply');
 const plus=document.getElementById('sayviPlus'),menu=document.getElementById('sayviMenu');
 const status=document.getElementById('sayviStatus');
 let active=null,sequence=0;
 const historyTurns=[];
 const answers=new Map();
 const storageKey='seyveo.sayvi.conversations.v1';
 let archive=[],currentId='conversation-'+Date.now(),savedTurns=[];
 function persist(){
  try{localStorage.setItem(storageKey,JSON.stringify({archive:archive.slice(0,40),currentId,turns:savedTurns.slice(-120)}));}
  catch(error){status.textContent='Историю не удалось сохранить на этом устройстве.';}
 }
 function snapshot(){
  return {id:currentId,updated:Date.now(),turns:savedTurns.slice(-120)};
 }
 function renderTurns(turns){
  answers.clear();list.replaceChildren();savedTurns=[];

 function toggleReplySpeech(turn,bubble,button,feedback){
  if(speakingTurn===turn){stopReplySpeech();return}

   feedback.textContent='На этом устройстве озвучивание недоступно';return;
  }
  const text=bubble.textContent.trim();
  if(!text)return;
  const utterance=new SpeechSynthesisUtterance(text.slice(0,10000));
  utterance.lang='ru-RU';utterance.rate=.97;

  utterance.voice=voices.find(v=>/^ru(?:[-_]|$)/i.test(v.lang)&&/milena|милена|tatyana|татьяна|irina|ирина|olga|ольга|anna|анна/i.test(v.name))
   ||voices.find(v=>/^ru(?:[-_]|$)/i.test(v.lang))||null;
  speakingTurn=turn;speechUtterance=utterance;speechButton=button;
  button.setAttribute('aria-pressed','true');
  button.setAttribute('aria-label','Остановить озвучивание');button.title='Остановить озвучивание';
  utterance.onend=()=>{if(speechUtterance===utterance)stopReplySpeech()};
  utterance.onerror=event=>{
   if(speechUtterance!==utterance)return;
   stopReplySpeech();
   if(event.error!=='canceled'&&event.error!=='interrupted')feedback.textContent='Не удалось озвучить ответ';

 function isReadableText(file){return readableTextTypes.test(file.type)||readableExtensions.test(file.name)}
 async function prepareAttachments(items){
  const segments=[],uploaded=[];
  for(const entry of items){
   const file=entry.file;
   if(isReadableText(file)){
    // Existing endpoint already accepts plain message text.
    if(file.size>100000)throw Error('Текстовый файл '+file.name+' слишком большой (максимум 100 КБ).');
    const content=await file.text();
    segments.push('Файл: '+file.name+'\n--- НАЧАЛО ФАЙЛА ---\n'+content.slice(0,100000)+'\n--- КОНЕЦ ФАЙЛА ---');
   }else{
    // Never imply that an image/PDF is understood unless upload succeeded.
    const body=new FormData();body.append('file',file,file.name);
    let response;
    try{response=await fetch('/api/seyveo-attachments',{method:'POST',credentials:'same-origin',body})}
    catch{throw Error('Сервер загрузки файлов сейчас недоступен. Вложение не отправлено.')}
    if(!response.ok)throw Error(response.status===404?'Загрузка фото и документов на сервере пока не подключена. Файл остался здесь.':'Сервер не принял вложение (код '+response.status+'). Файл остался здесь.');
    const info=await response.json().catch(()=>null);
    if(!info||typeof info.id!=='string'||!info.id.trim())throw Error('Сервер не подтвердил загрузку '+file.name+'. Вложение не отправлено.');
    uploaded.push({id:info.id,name:file.name,type:file.type||'application/octet-stream',size:file.size});
   }
  }
  return {segments,uploaded};
 }

 // A real 2D sketch board: pressure-sensitive Pointer Events for Samsung S Pen
 // with finger/mouse fallback. Strokes are rasterized only when attached.
 const drawPanel=document.getElementById('sayviDrawing');
 const drawCanvas=document.getElementById('sayviDrawCanvas');
 const drawBoard=drawCanvas.parentElement;
 const drawCtx=drawCanvas.getContext('2d');
 const drawUndo=document.getElementById('sayviDrawUndo');
 const drawAttach=document.getElementById('sayviDrawAttach');
 let drawTool='pen',drawStrokes=[],drawCurrent=null,drawActivePointer=null,drawSize={w:0,h:0};
 function drawPoint(event){
  const r=drawCanvas.getBoundingClientRect();
  return {x:Math.max(0,Math.min(1,(event.clientX-r.left)/Math.max(1,r.width))),
          y:Math.max(0,Math.min(1,(event.clientY-r.top)/Math.max(1,r.height))),
          p:event.pointerType==='pen'&&event.pressure>0?event.pressure:.5};
 }
 function drawRepaint(){
  if(!drawCtx)return;
  const {w,h}=drawSize;if(!w||!h)return;
  drawCtx.clearRect(0,0,w,h);
  drawCtx.fillStyle='#f8f9f9';drawCtx.fillRect(0,0,w,h);
  for(const stroke of [...drawStrokes,...(drawCurrent?[drawCurrent]:[])]){
   const points=stroke.points;if(!points.length)continue;
   drawCtx.lineCap='round';drawCtx.lineJoin='round';
   drawCtx.strokeStyle=stroke.tool==='eraser'?'#f8f9f9':'#27343c';
   drawCtx.fillStyle=drawCtx.strokeStyle;
   if(points.length===1){
    const p=points[0],rad=(stroke.tool==='eraser'?12:1.6)*(.5+p.p)/2;
    drawCtx.beginPath();drawCtx.arc(p.x*w,p.y*h,rad,0,Math.PI*2);drawCtx.fill();continue;
   }
   for(let i=1;i<points.length;i++){
    const a=points[i-1],b=points[i];
    drawCtx.lineWidth=stroke.tool==='eraser'?24:Math.max(1.1,1.2+3*b.p);
    drawCtx.beginPath();drawCtx.moveTo(a.x*w,a.y*h);drawCtx.lineTo(b.x*w,b.y*h);drawCtx.stroke();
   }
  }
  drawUndo.disabled=drawStrokes.length===0;
  drawAttach.disabled=drawStrokes.length===0;
 }
 function drawResize(){
  if(drawPanel.hidden)return;
  const r=drawBoard.getBoundingClientRect();
  const w=Math.max(1,Math.round(r.width)),h=Math.max(1,Math.round(r.height));
  if(!w||!h)return;
  drawSize={w,h};
  const dpr=Math.min(window.devicePixelRatio||1,2);
  drawCanvas.width=Math.round(w*dpr);drawCanvas.height=Math.round(h*dpr);
  drawCtx.setTransform(dpr,0,0,dpr,0,0);
  drawRepaint();
 }
 function drawOpen(){
  closeMenu();drawPanel.hidden=false;drawStrokes=[];drawCurrent=null;drawActivePointer=null;
  drawTool='pen';document.querySelectorAll('[data-draw-tool]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.drawTool==='pen')));
  drawResize();
 }
 function drawClose(){drawPanel.hidden=true;drawCurrent=null;drawActivePointer=null}

 document.getElementById('sayviDrawCancel').addEventListener('click',drawClose);
 document.querySelectorAll('[data-draw-tool]').forEach(b=>b.addEventListener('click',()=>{
  drawTool=b.dataset.drawTool;

 }));
 drawCanvas.addEventListener('pointerdown',event=>{
  if(drawActivePointer!==null||!event.isPrimary&&event.pointerType!=='mouse')return;
  event.preventDefault();
  drawActivePointer=event.pointerId;drawCurrent={tool:drawTool,points:[drawPoint(event)]};
  try{drawCanvas.setPointerCapture(event.pointerId)}catch{}
  drawRepaint();
 });
 drawCanvas.addEventListener('pointermove',event=>{
  if(drawActivePointer!==event.pointerId||!drawCurrent)return;
  event.preventDefault();
  const coalesced=typeof event.getCoalescedEvents==='function'?event.getCoalescedEvents():[];
  for(const e of coalesced.length?coalesced:[event])drawCurrent.points.push(drawPoint(e));
  drawRepaint();
 });
 function drawEnd(event){
  if(drawActivePointer!==event.pointerId)return;
  if(drawCurrent){drawCurrent.points.push(drawPoint(event));drawStrokes.push(drawCurrent)}
  drawCurrent=null;drawActivePointer=null;drawRepaint();
 }
 drawCanvas.addEventListener('pointerup',drawEnd);
 drawCanvas.addEventListener('pointercancel',event=>{
  if(drawActivePointer!==event.pointerId)return;
  drawCurrent=null;drawActivePointer=null;drawRepaint();
 });

 async function ask(question,options={}){
  const controller=new AbortController();active=controller;updateControls();
  status.textContent='';
  const id=++sequence,replyId='reply-'+id;
  if(!options.skipUser)append('user','user-'+id,options.displayMessage||question);
  let answer='',done=false,streamingTurn=null;
  const thinkingStarted=performance.now();
  const stopThinking=showThinking();
  async function finishThinking(){
   const remaining=900-(performance.now()-thinkingStarted);
   if(remaining>0&&!controller.signal.aborted)await new Promise(resolve=>setTimeout(resolve,remaining));
   stopThinking();
  }
  function revealAnswer(text){
   if(!streamingTurn){
    stopThinking();
    append('assistant',replyId,text);
    streamingTurn=answers.get(replyId)?.closest('.turn');
    if(streamingTurn){
     streamingTurn.classList.add('is-streaming','is-fresh');
     setTimeout(()=>streamingTurn?.classList.remove('is-fresh'),320);
    }
   }else append('assistant',replyId,text);
  }
  try{
   const response=await fetch('/api/seyveo-stream',{
    method:'POST',credentials:'same-origin',
    headers:{'content-type':'application/json'},
    body:JSON.stringify({message:question,history:historyTurns.slice(-6),...(options.attachments?.length?{attachments:options.attachments}:{})}),
    signal:controller.signal
   });
   if(!response.ok){
    if(response.status===404||response.status===405)throw Error('Для живых ответов Сэйви нужно подключение сервера ИИ. На GitHub Pages он недоступен.');
    const body=await response.json().catch(()=>({}));
    throw Error(body.error||'Не удалось получить ответ Сэйви.');
   }
   if(!response.body)throw Error('Браузер не поддерживает потоковые ответы.');
   const reader=response.body.getReader(),decoder=new TextDecoder();
   let buffer='';
   function consume(line){
    if(!line.trim())return;
    const part=JSON.parse(line);
    if(part.type==='delta'&&typeof part.text==='string'){
     answer+=part.text;revealAnswer(answer);
    }else if(part.type==='done')done=true;
    else if(part.type==='error')throw Error(part.text||'Ошибка ответа Сэйви.');
   }
   while(true){
    const chunk=await reader.read();
    if(chunk.done)break;
    buffer+=decoder.decode(chunk.value,{stream:true});
    let n;
    while((n=buffer.indexOf('\n'))!==-1){
     consume(buffer.slice(0,n));buffer=buffer.slice(n+1);
    }
   }
   buffer+=decoder.decode();
   if(buffer.trim())consume(buffer);
   if(!done)throw Error('Соединение прервалось.');
   if(!answer.trim())throw Error('Сэйви не прислала ответ.');
   historyTurns.push({role:'user',content:question.slice(0,250)},{role:'assistant',content:answer.slice(0,450)});
   if(historyTurns.length>12)historyTurns.splice(0,historyTurns.length-12);
  }catch(error){
   if(!controller.signal.aborted){
    status.textContent=String(error?.message||'Ошибка соединения.');
    if(answer)revealAnswer(answer);
   }
  }finally{
   streamingTurn?.classList.remove('is-streaming','is-fresh');
   await finishThinking();
   if(active===controller){active=null;updateControls()}
  }
 }

 async function send(){

 // Hold to record using the browser's real microphone.
 // This static prototype has no server-side audio delivery yet.
 // Speech-to-text: no recorded audio bubble appears in the conversation.
 const speechBar=document.getElementById('sayviSpeechBar');
 const speechTime=document.getElementById('sayviSpeechTime');
 const SpeechApi=window.SpeechRecognition||window.webkitSpeechRecognition;
 let speechSession=null,spokenFinal='',spokenInterim='',speechStart=0,speechTimer=null;
 let speechGeneration=0,speechAborted=false,speechStopping=false,speechSendRequested=false;
 let speechWatchdog=null,speechHasResult=false;
 function updateSpeechClock(){
  const seconds=Math.floor((performance.now()-speechStart)/1000);
  speechTime.textContent=Math.floor(seconds/60)+':'+String(seconds%60).padStart(2,'0');
 }
 function clearSpeech(){
  clearInterval(speechTimer);speechTimer=null;
  clearTimeout(speechWatchdog);speechWatchdog=null;
  speechBar.hidden=true;
  speechBar.removeAttribute('data-state');mic.classList.remove('is-recording');
  mic.setAttribute('aria-label','Начать голосовой ввод');
  spokenFinal='';spokenInterim='';speechStopping=false;
 }
 function cancelSpeech(){
  speechAborted=true;++speechGeneration;
  const old=speechSession;speechSession=null;
  try{old?.abort()}catch{}
  clearSpeech();status.textContent='Голосовой ввод отменён.';
 }
 function completeSpeech(generation){
  if(generation!==speechGeneration||speechAborted)return;
  const text=(spokenFinal||spokenInterim).trim();
  const shouldSend=speechSendRequested;
  speechSendRequested=false;
  const finished=speechSession;
  speechSession=null;
  // Force-release any WebKit speech capture session even when onend is late.
  ++speechGeneration;
  try{finished?.abort()}catch{}
  clearSpeech();
  if(text){
   if(shouldSend)ask(text);
   else{
    input.value=text;updateControls();
    status.textContent='Речь распознана. Нажмите стрелку отправки.';
   }
  }else{
   status.textContent='Не удалось распознать речь. Можно попробовать ещё раз.';
  }
 }
 function stopSpeech(){
  if(!speechSession||speechStopping)return;
  speechStopping=true;speechBar.dataset.state='processing';
  const generation=speechGeneration;
  try{speechSession.stop()}catch{}
  setTimeout(()=>{
   if(generation===speechGeneration&&speechSession){
    // Safari may not fire onend after stop. Abort the underlying capture
    // before returning to the idle UI, to release the microphone indicator.
    completeSpeech(generation);
   }
  },1000);
 }
 function sendSpeech(){
  if(speechSession){
   speechSendRequested=true;stopSpeech();return;
  }
  if(input.value.trim())send();
 }
 function startSpeech(){
  if(speechSession){stopSpeech();return}
  if(active||input.value.trim())return;
  status.textContent='';
  if(!SpeechApi){
   status.textContent='В этом браузере нет распознавания речи. Можно использовать микрофон клавиатуры iPhone.';
   return;
  }
  let r;try{r=new SpeechApi()}catch{status.textContent='Голосовой ввод недоступен.';return}
  speechAborted=false;speechStopping=false;speechSendRequested=false;speechHasResult=false;
  const generation=++speechGeneration;
  speechSession=r;spokenFinal='';spokenInterim='';
  r.lang='ru-RU';r.continuous=false;r.interimResults=true;r.maxAlternatives=1;
  r.onresult=event=>{
   if(generation!==speechGeneration)return;
   speechHasResult=true;
   let final='',interim='';
   for(let i=0;i<event.results.length;i++){
    const transcript=event.results[i][0]?.transcript||'';
    if(event.results[i].isFinal)final+=transcript+' ';
    else interim+=transcript+' ';
   }
   spokenFinal=final.trim();spokenInterim=interim.trim();
  };
  r.onerror=event=>{
   if(generation!==speechGeneration)return;
   const code=event.error||'unknown';
   speechAborted=true;++speechGeneration;
   try{speechSession?.abort()}catch{}
   speechSession=null;clearSpeech();
   // Permission to the mic and permission/availability of a speech service
   // are not the same thing. Avoid falsely blaming iOS microphone settings.
   status.textContent=code==='not-allowed'
    ?'Safari отказал в голосовом вводе. Проверьте разрешение микрофона для этого сайта.'
    :code==='service-not-allowed'
    ?'Служба распознавания речи Safari недоступна. Микрофон может быть разрешён. Используйте диктовку клавиатуры iPhone.'
    :code==='audio-capture'
    ?'Safari не смог открыть микрофон. Проверьте, не использует ли его другое приложение.'
    :code==='no-speech'?'Речь не распознана. Попробуйте ещё раз.'
    :'Ошибка распознавания ('+code+'). Можно использовать диктовку клавиатуры iPhone.';
  };
  r.onend=()=>completeSpeech(generation);
  speechStart=performance.now();updateSpeechClock();
  speechBar.hidden=false;mic.classList.add('is-recording');
  mic.setAttribute('aria-label','Завершить голосовой ввод');
  speechTimer=setInterval(updateSpeechClock,250);
  // WebKit sometimes leaves recognition silently active without callbacks.
  // Recover instead of holding the microphone indefinitely.
  speechWatchdog=setTimeout(()=>{
   if(generation!==speechGeneration||!speechSession||speechStopping)return;
   if(speechHasResult){stopSpeech();return}
   speechAborted=true;++speechGeneration;
   const stuck=speechSession;speechSession=null;
   try{stuck.abort()}catch{}
   clearSpeech();
   status.textContent='Safari не ответил на голосовой ввод. Попробуйте ещё раз или диктовку клавиатуры.';
  },30000);
  try{r.start()}catch{
   ++speechGeneration;try{r.abort()}catch{}
   speechSession=null;clearSpeech();
   status.textContent='Не удалось запустить распознавание речи в Safari.';
  }
 }
 mic.addEventListener('click',startSpeech);
 document.getElementById('sayviSpeechStop').addEventListener('click',stopSpeech);

 // A hidden page should never keep the phone's microphone active.
 function releaseSpeechOnLeave(){
  if(!speechSession)return;
  ++speechGeneration;speechAborted=true;speechSendRequested=false;
  const old=speechSession;speechSession=null;
  try{old.abort()}catch{}

 }

 // iOS can briefly hide the document while asking permission to use speech.
 // Do not abort on visibilitychange: that cancels the initial permission flow.
 // pagehide above handles actual navigation away from this chat.
 restore();

})();
