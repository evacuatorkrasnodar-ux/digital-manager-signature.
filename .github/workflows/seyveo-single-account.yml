name: SEYVEO Single Account · trusted workspaces

on:
  push:
    branches: [main]
    paths:
      - 'server/business-identity/workspace-manifest.mjs'
      - 'server/business-identity/workspace-manifest.test.mjs'
      - 'server/business-identity/single-account-api.mjs'
      - 'server/business-identity/single-account-api.test.mjs'
      - 'server/business-identity/personal-session-http.mjs'
      - 'server/business-identity/personal-session-http.test.mjs'
      - 'mobile/src/business/workspace-navigation.mjs'
      - 'mobile/tests/workspace-navigation.test.mjs'
      - 'mobile/src/business/verified-workspace-client.mjs'
      - 'mobile/tests/verified-workspace-client.test.mjs'
      - 'mobile/src/auth/native-credential-vault.mjs'
      - 'mobile/src/auth/native-credential-vault.d.mts'
      - 'mobile/src/auth/ExpoNativeCredentialVault.ts'
      - 'mobile/tests/native-credential-vault.test.mjs'
      - 'mobile/src/auth/verified-account-bridge.mjs'
      - 'mobile/src/auth/verified-account-bridge.d.mts'
      - 'mobile/tests/verified-account-bridge.test.mjs'
      - '.github/workflows/seyveo-single-account.yml'
  pull_request:
    paths:
      - 'server/business-identity/workspace-manifest.mjs'
      - 'server/business-identity/workspace-manifest.test.mjs'
      - 'server/business-identity/single-account-api.mjs'
      - 'server/business-identity/single-account-api.test.mjs'
      - 'server/business-identity/personal-session-http.mjs'
      - 'server/business-identity/personal-session-http.test.mjs'
      - 'mobile/src/business/workspace-navigation.mjs'
      - 'mobile/tests/workspace-navigation.test.mjs'
      - 'mobile/src/business/verified-workspace-client.mjs'
      - 'mobile/tests/verified-workspace-client.test.mjs'
      - 'mobile/src/auth/native-credential-vault.mjs'
      - 'mobile/src/auth/native-credential-vault.d.mts'
      - 'mobile/src/auth/ExpoNativeCredentialVault.ts'
      - 'mobile/tests/native-credential-vault.test.mjs'
      - 'mobile/src/auth/verified-account-bridge.mjs'
      - 'mobile/src/auth/verified-account-bridge.d.mts'
      - 'mobile/tests/verified-account-bridge.test.mjs'
      - '.github/workflows/seyveo-single-account.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verified-workspaces:
    name: One account, isolated workspaces, fail-closed access
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test server manifest and native ONE navigation
        run: node --test server/business-identity/workspace-manifest.test.mjs server/business-identity/single-account-api.test.mjs server/business-identity/personal-session-http.test.mjs mobile/tests/workspace-navigation.test.mjs mobile/tests/verified-workspace-client.test.mjs mobile/tests/native-credential-vault.test.mjs mobile/tests/verified-account-bridge.test.mjs
