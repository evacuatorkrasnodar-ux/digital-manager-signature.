name: SEYVEO Code Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript, CSS and project links
        run: node tools/check-quality.cjs
      - name: Check read-only Windows server readiness logic
        run: node --test server/tests/check-seyveo-pc.test.mjs
      - name: Test original silver plasma in dark and light themes
        run: node tools/test-plasma-silver.cjs
      - name: Test installed PWA Home scrolling and dock isolation
        run: node tools/test-pwa-home-dock.cjs
      - name: Test centered five-button dock on iPhone X
        run: node tools/test-five-dock.cjs
      - name: Test context-driven task priority
        run: node tools/test-context-focus.cjs
      - name: Check Signature workspaces and semantic task controls
        run: node tools/test-signature-workspaces.cjs
      - name: Test one-sphere Living Screen director
        run: node tools/test-living-screen.cjs
      - name: Protect Living Ink interface across workspaces
        run: node tools/test-living-ink.cjs
      - name: Test readable History, Notes, Health and Care workspaces
        run: node tools/test-living-workspaces.cjs
      - name: Test fixed Sayvi dock without swipe pages
        run: node tools/test-magnetic-ink.cjs
      - name: Verify official YouTube SEYVA PLAY and resource release
        run: node tools/test-seyveo-video.cjs
      - name: Test local music metadata, lock artwork and background playback
        run: node tools/test-music-quality.cjs
      - name: Confirm actual Hi-Res source before drawing badge
        run: node tools/test-music-source-quality.cjs
      - name: Test local calendar reminders
        run: node tools/test-calendar-reminders.cjs
      - name: Test spoken and typed task commands
        run: node tools/test-task-natural.cjs
      - name: Test one-phone-book SEYVEO call scenario
        run: node tools/test-contact-call.cjs
      - name: Test one-step local actions
        run: node tools/test-local-actions.cjs
      - name: Test multi-turn reminder conversations
        run: node tools/test-reminder-dialogue.cjs
      - name: Verify SEYVEO Open Canvas chat layout contracts
        run: node tools/test-open-canvas.cjs
