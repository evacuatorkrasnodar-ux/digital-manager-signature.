<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 30 440 440" role="img" aria-label="Полупрозрачная стеклянная плазма">
<defs>
<radialGradient id="body" cx=".44" cy=".38" r=".74"><stop stop-color="#f8faff"/><stop offset=".38" stop-color="#e8eef7"/><stop offset=".76" stop-color="#cbd8e9"/><stop offset="1" stop-color="#a8bacf"/></radialGradient>
<radialGradient id="edgewash" cx=".48" cy=".45" r=".52"><stop offset=".53" stop-color="#fdfdff" stop-opacity="0"/><stop offset=".78" stop-color="#fdfdff" stop-opacity=".04"/><stop offset=".92" stop-color="#9ab5e5" stop-opacity=".18"/><stop offset="1" stop-color="#fdfdff" stop-opacity=".45"/></radialGradient>
<linearGradient id="filament" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fdfdff" stop-opacity=".09"/><stop offset=".17" stop-color="#fdfdff" stop-opacity=".84"/><stop offset=".36" stop-color="#7f93ab" stop-opacity=".44"/><stop offset=".56" stop-color="#fdfdff" stop-opacity=".97"/><stop offset=".79" stop-color="#7f93aa" stop-opacity=".32"/><stop offset="1" stop-color="#8ba9d6" stop-opacity=".15"/></linearGradient>
<linearGradient id="silk" x1=".13" y1=".15" x2=".87" y2=".95"><stop stop-color="#fdfdff" stop-opacity="0"/><stop offset=".13" stop-color="#fdfdff" stop-opacity=".39"/><stop offset=".35" stop-color="#8ba9d6" stop-opacity=".06"/><stop offset=".6" stop-color="#fdfdff" stop-opacity=".18"/><stop offset=".8" stop-color="#fdfdff" stop-opacity=".58"/><stop offset="1" stop-color="#fdfdff" stop-opacity="0"/></linearGradient>
<linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7d8ea3" stop-opacity=".43"/><stop offset=".17" stop-color="#fdfdff" stop-opacity=".96"/><stop offset=".36" stop-color="#72859d" stop-opacity=".27"/><stop offset=".69" stop-color="#74879f" stop-opacity=".31"/><stop offset=".88" stop-color="#fdfdff" stop-opacity=".95"/><stop offset="1" stop-color="#71849b" stop-opacity=".48"/></linearGradient>
<filter id="soft"><feGaussianBlur stdDeviation="3.6"/></filter>
<filter id="halo"><feGaussianBlur stdDeviation="7"/></filter>
<clipPath id="clip"><circle cx="260" cy="250" r="175"/></clipPath>
<style>
/* Deep Reveal: fixed glass silhouette, only subdued inner currents move. */
.g-a,.g-b{transform-box:view-box;transform-origin:260px 250px}
.g-a{animation:glass-a 19s ease-in-out infinite alternate}
.g-b{animation:glass-b 23s ease-in-out infinite alternate}
.glass-glint{animation:glass-lustre 18s ease-in-out infinite alternate}
@keyframes glass-a{from{transform:translate(-3px,2px) rotate(-1.2deg);opacity:.72}to{transform:translate(3px,-2px) rotate(1.2deg);opacity:.91}}
@keyframes glass-b{from{transform:translate(2px,-2px) rotate(.9deg);opacity:.78}to{transform:translate(-2px,2px) rotate(-.9deg);opacity:.96}}
@keyframes glass-lustre{from{opacity:.40}to{opacity:.64}}
@media(prefers-reduced-motion:reduce){.g-a,.g-b,.glass-glint{animation:none;transform:none}}
</style>
</defs>
<circle cx="260" cy="250" r="176" fill="url(#body)"/>
<circle cx="260" cy="250" r="175.2" fill="url(#edgewash)"/>
<g clip-path="url(#clip)">
<!-- Soft crescent-shaped light, no lines crossing the centre. -->
<g class="g-b" fill="url(#silk)" opacity=".5">
<path d="M99 269C132 174 210 126 291 127C356 129 413 181 431 249C399 183 337 163 285 168C205 172 153 226 99 269Z"/>
<path d="M117 325C169 393 254 420 337 385C391 361 420 316 434 255C432 354 350 421 274 420C202 420 148 378 117 325Z" opacity=".66"/>
</g>
<g class="g-a" fill="none" stroke="url(#filament)" stroke-linecap="round" filter="url(#soft)" opacity=".42">
<path d="M110 253C150 154 245 113 324 139C378 155 412 191 429 232" stroke-width="5.4"/>
<path d="M115 322C191 420 324 433 411 342" stroke-width="3.8"/>
</g>
<path class="glass-glint" d="M110 201C156 121 235 94 307 112" fill="none" stroke="#fdfdff" stroke-opacity=".38" stroke-width="7" filter="url(#halo)"/>
</g>
<circle cx="260" cy="250" r="175.4" fill="none" stroke="url(#rim)" stroke-width="2.25" opacity=".88"/>
</svg>