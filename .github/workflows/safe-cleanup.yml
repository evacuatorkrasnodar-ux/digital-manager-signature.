name: SEYVEO · Safe cleanup guard

on:
  push:
    branches:
      - 'audit/**'
    paths:
      - 'index.html'
      - 'assets/**'
      - 'scripts/check-entrypoint-assets.mjs'
      - '.github/workflows/safe-cleanup.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'assets/**'
      - 'scripts/check-entrypoint-assets.mjs'
      - '.github/workflows/safe-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-static-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check entrypoint dependencies
        run: node scripts/check-entrypoint-assets.mjs
