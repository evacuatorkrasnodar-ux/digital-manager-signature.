<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SEYVEO · Проверка внешней рамки</title>
<style>
html,body{margin:0!important;padding:0!important;width:100%!important;min-width:0;min-height:100%;height:100%;overflow:hidden;box-sizing:border-box;background:#131C24!important;border:0!important;border-radius:0!important;outline:0!important;box-shadow:none!important;-webkit-appearance:none;appearance:none}
*{box-sizing:border-box}
main{position:fixed;inset:0;margin:0!important;width:100vw;height:100dvh;padding:0;background:linear-gradient(180deg,#263640,#131C24);border:0!important;border-radius:0!important;box-shadow:none!important;outline:0!important}
.edge{position:absolute;pointer-events:none;background:#DFE5E8}
.edge.left{left:0;top:0;bottom:0;width:1px}
.edge.right{right:0;top:0;bottom:0;width:1px}
.edge.top{left:0;right:0;top:0;height:1px}
.edge.bottom{left:0;right:0;bottom:0;height:1px}
.content{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:22px;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;text-align:center}
h1{font-size:24px;font-weight:650;margin:0;line-height:1.2}
p{max-width:320px;font-size:14px;line-height:1.5;color:#c3cbd2;margin:0}
small{font-size:12px;color:#c3cbd2}
.cap{margin-top:24px;width:230px;max-width:70vw;height:55px;border-radius:999px;background:#38383A;display:grid;place-items:center;color:#fff;font-size:13px}
@media(min-width:760px){.content{max-width:560px;margin:auto}}
</style>
</head>
<body>
<main>
 <i class="edge left"></i><i class="edge right"></i><i class="edge top"></i><i class="edge bottom"></i>
 <div class="content">
 <h1>Проверка границ SEYVEO</h1>
 <p>Это отдельная чистая страница: здесь нет стилей приложения, окон, музыки, чатов и дока.</p>
 <small>Белая линия толщиной 1 px должна касаться всех четырёх краёв браузерной области.</small>
 <div class="cap">Проверочная капсула</div>
 </div>
</main>
</body>
</html>
