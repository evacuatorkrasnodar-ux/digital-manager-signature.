name: SEYVEO · Safe cleanup guard

on:
  push:
    branches:
      - 'audit/**'
    paths:
      - 'index.html'
      - 'assets/**'
      - 'mobile/**'
      - 'scripts/check-entrypoint-assets.mjs'
      - '.github/workflows/safe-cleanup.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'assets/**'
      - 'mobile/**'
      - 'scripts/check-entrypoint-assets.mjs'
      - '.github/workflows/safe-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-static-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check entrypoint dependencies
        run: node scripts/check-entrypoint-assets.mjs

  check-rise-logic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate native RISE JavaScript modules
        run: |
          for file in mobile/src/rise/*.mjs; do node --check "$file"; done
      - name: Run all mobile unit tests
        working-directory: mobile
        run: npm test

  check-native-types:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund
      - name: Validate TypeScript
        working-directory: mobile
        run: npm run check
      - name: Validate Expo configuration
        working-directory: mobile
        run: npx expo config --json > /dev/null
