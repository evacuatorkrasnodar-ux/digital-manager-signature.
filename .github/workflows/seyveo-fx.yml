name: SEYVEO Currency Snapshot
on:
  schedule:
    - cron: '25 19 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: seyveo-fx-snapshot
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Refresh public exchange rates
        run: node scripts/refresh-seyveo-fx.mjs
      - name: Publish changed snapshot
        id: publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/seyveo-fx-rates.json
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m 'Refresh SEYVEO currency rates'
          git pull --rebase origin main
          git push origin HEAD:main
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Request Pages rebuild if enabled
        if: steps.publish.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
