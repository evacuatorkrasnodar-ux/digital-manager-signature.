<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#090a0c"><meta name="description" content="Живая главная Цифрового управляющего — демонстрация"><title>Цифровой управляющий · Living Interface</title><style>

*{box-sizing:border-box}html,body{min-height:100%;margin:0;background:var(--bg);color:var(--text)}body{-webkit-font-smoothing:antialiased}.app{max-width:530px;margin:auto;min-height:100dvh;display:flex;flex-direction:column;padding:calc(24px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom))}button{font:inherit;cursor:pointer;color:inherit;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:2px solid #b3c4e7;outline-offset:3px}.top{display:flex;align-items:center;gap:12px}.mark{width:42px;height:42px;display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;font-family:Georgia,serif;font-size:17px;background:var(--card)}.heading{flex:1}h1{font-size:28px;margin:0;font-weight:690;letter-spacing:-.05em}.greeting{font-size:13px;color:var(--secondary);margin:5px 0 0}.round{height:41px;width:41px;background:var(--card);border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;font-size:19px}.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:470px;position:relative}/* Cinematic Plasma Signature — replaces the prototype CSS rings */

.message{text-align:center;width:100%;max-width:380px;margin-top:-4px;min-height:115px}.kicker{font-size:10px;letter-spacing:.16em;color:var(--secondary);text-transform:uppercase}.message h2{font-size:19px;font-weight:660;line-height:1.25;letter-spacing:-.025em;margin:11px 0 7px}.message p{font-size:13px;color:var(--secondary);line-height:1.5;margin:0}.panel{width:100%;background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:0 8px 26px var(--shadow)}.event{padding:16px;margin:10px 0 12px;animation:arrive .25s ease-out}.event-head{display:flex;gap:12px;align-items:center}.event-icon{width:42px;height:42px;flex:none;display:grid;place-items:center;background:var(--card2);border:1px solid var(--line);border-radius:13px;font-size:20px}.event-copy{flex:1}.event-copy strong{display:block;font-size:14px}.event-copy small{display:block;font-size:12px;color:var(--secondary);margin-top:4px}.actions{display:flex;gap:8px;margin-top:15px}.btn{padding:13px 12px;border:1px solid var(--line);background:var(--card2);border-radius:13px;flex:1;font-size:13px;font-weight:600;min-height:45px}.btn.primary{background:#eaf1fb;color:#152032;border-color:#eaf1fb}:root[data-theme=light] .btn.primary{background:#16243a;color:white;border-color:#16243a}.mini{margin-top:12px;text-align:center;font-size:12px;color:var(--secondary)}.prompt{display:flex;gap:10px;margin-top:auto;background:var(--card);border:1px solid var(--line);border-radius:26px;padding:7px 7px 7px 18px;align-items:center}.prompt[hidden]{display:none}.prompt input{flex:1;min-width:0;color:var(--text);background:transparent;border:0;outline:0;font:inherit;font-size:14px}.prompt button{height:40px;width:40px;border:0;border-radius:50%;background:var(--card2)}/* Signature dock — a single component; dark/light shared geometry */

.assistant-button:focus-visible{outline:2px solid #d4e6ff;outline-offset:5px}
.button-art{width:74px;height:74px;display:block;overflow:visible}

:root[data-theme=light] .dock{--dock-edge:#ffffffef;--dock-fill:#f8faffdf;--dock-highlight:#ffffffb8;--dock-line:#ffffffee;--dock-shine:#ffffffd6;box-shadow:inset 0 1px 2px #fff,0 10px 28px #41557321}

:root[data-theme=light] .button-art .face-reflection{opacity:.4}

:root[data-theme=light] .assistant-button.listening{filter:drop-shadow(0 0 8px #8ba6e8b0)}
@media(max-width:355px){.nav-home{left:14%}.nav-tasks{left:32%}.nav-manage{left:87%}.nav-item{width:58px;font-size:9px}}
@media(prefers-reduced-motion:reduce){.assistant-button{transition:none}}
.app{padding-bottom:calc(14px + env(safe-area-inset-bottom))}.demo{margin-top:12px;text-align:center}.demo button{border:0;color:var(--secondary);font-size:11px;padding:10px;background:transparent}.activity{padding:13px 15px;margin-top:10px}.activity strong{font-size:12px}.activity p{margin:6px 0 0;font-size:12px;line-height:1.4;color:var(--secondary)}dialog{width:min(410px,calc(100% - 34px));border:1px solid var(--line);border-radius:20px;background:var(--card);color:var(--text);padding:22px}dialog::backdrop{background:#0009;backdrop-filter:blur(4px)}dialog h2{margin-top:0}dialog p{color:var(--secondary);line-height:1.55;font-size:14px}@keyframes arrive{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}@media(max-height:760px){.stage{min-height:370px}.plasma{width:245px;height:245px;min-width:0;min-height:0}.message{min-height:100px}}
</style></head><body><div class="app"><header class="top"><div class="mark">PW</div><div class="heading"><h1>Мой день</h1><p class="greeting">Доброе утро, Роман</p></div><button id="theme" class="round" aria-label="Переключить тему">◐</button></header><main style="flex:1;display:flex;flex-direction:column"><section id="stage" class="stage" data-mode="attention"><button id="orb" class="plasma" aria-label="Посмотреть сигнал управляющего"><img class="plasma-art" src="assets/plasma-signature.svg" alt="" draggable="false"><span class="symbol">PW</span><span id="signal" class="signal">✉</span></button><div class="message" aria-live="polite"><div id="kicker" class="kicker">Требуется внимание</div><h2 id="headline">Роман, пришло важное письмо</h2><p id="subline">Я подготовил ответ. Осталось ваше согласование.</p></div></section><div id="dynamic"></div><form class="prompt" id="ask" hidden><input id="question" aria-label="Сообщение управляющему" placeholder="Напишите управляющему…" autocomplete="off"><button type="submit" aria-label="Отправить">➤</button><button id="hideInput" type="button" aria-label="Скрыть поле">×</button></form><div class="demo"><button id="demoNext" type="button">Демо: следующее событие ↻</button></div></main><footer class="dock" aria-label="Навигация">

<circle cx="37" cy="37" r="35.5" fill="#0d1520" stroke="#b0bfd3" stroke-width=".8"/>
<circle cx="37" cy="37" r="34" fill="none" stroke="url(#bezel)" stroke-width="3.5"/>

</svg></button>
<span class="ask-caption" aria-hidden="true">Спросить</span>

</footer><div id="voiceHint" class="voice-hint" role="status" aria-live="polite">Нажмите — написать · удерживайте — говорить</div></div><dialog id="info"><h2 id="infoTitle"></h2><p id="infoText"></p><button id="infoClose" class="btn primary">Понятно</button></dialog><script>
(()=>{'use strict';const KEY='dm-signature-living-v1';const $=id=>document.getElementById(id);const stories=[{title:'Роман, пришло важное письмо',text:'Я подготовил ответ. Осталось ваше согласование.',type:'mail',icon:'✉',card:'Письмо от клиента',detail:'Ответ подготовлен в демонстрационном режиме. Реальные письма не подключены.',main:'Согласовать',other:'Посмотреть'},{title:'Встреча через час',text:'Я собрал краткий план разговора.',type:'meeting',icon:'▦',card:'Встреча с клиентом · 10:00',detail:'План встречи подготовлен в демонстрационном режиме. Календарь не подключён.',main:'Принять план',other:'Посмотреть'},{title:'Отчёт готов',text:'Проверил цифры и подготовил краткую сводку.',type:'report',icon:'✓',card:'Отчёт за неделю',detail:'Показатели демонстрационные. Реальные финансы не подключены.',main:'Принять',other:'Посмотреть'}];let state={theme:'dark',index:0,activity:[]};try{const r=JSON.parse(localStorage.getItem(KEY)||'{}');if(r&&typeof r==='object'){state.theme=r.theme==='light'?'light':'dark';state.index=Number.isInteger(r.index)?Math.max(0,Math.min(3,r.index)):0;state.activity=Array.isArray(r.activity)?r.activity.slice(-8).filter(v=>typeof v==='string'):[]}}catch{}const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}};function popup(title,desc){$('infoTitle').textContent=title;$('infoText').textContent=desc;$('info').showModal()}function render(){document.documentElement.dataset.theme=state.theme;const s=stories[state.index];const calm=!s;const action=state.index===2;$('stage').dataset.mode=calm?'calm':action?'action':'attention';$('signal').textContent=calm?'':s.icon;$('kicker').textContent=calm?'Всё спокойно':action?'Работа завершена':'Требуется внимание';$('headline').textContent=calm?'Сейчас ничто не требует вашего решения':s.title;$('subline').textContent=calm?'Я покажу важное, когда оно появится. Данные пока демонстрационные.':s.text;let body='';if(s){body='<article class="panel event"><div class="event-head"><span class="event-icon">'+s.icon+'</span><div class="event-copy"><strong>'+s.card+'</strong><small>'+s.detail+'</small></div></div><div class="actions"><button class="btn" id="inspect" type="button">'+s.other+'</button><button class="btn primary" id="resolve" type="button">'+s.main+'</button></div></article>'}else body='<div class="mini">Завершённые события остались в истории ниже.</div>';if(state.activity.length){body+='<div class="panel activity"><strong>Последние действия</strong><p>'+state.activity.slice(-3).reverse().map(escapeHtml).join('<br>')+'</p></div>'}$('dynamic').innerHTML=body;$('inspect')?.addEventListener('click',()=>popup(s.card,s.detail));$('resolve')?.addEventListener('click',()=>{state.activity.push('✓ '+s.card+' — демонстрационное действие');state.index=Math.min(3,state.index+1);save();render()})}function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}$('theme').addEventListener('click',()=>{state.theme=state.theme==='dark'?'light':'dark';save();render()});$('demoNext').addEventListener('click',()=>{state.index=(state.index+1)%4;save();render()});$('orb').addEventListener('click',()=>{const s=stories[state.index];popup(s?'Живой сигнал':'Управляющий на связи',s?s.detail:'Сейчас нет демонстрационных событий, требующих внимания.')});$('ask').addEventListener('submit',e=>{e.preventDefault();const v=$('question').value.trim();if(!v)return;popup('Вы спросили: '+v,'В этой версии показан интерфейс общения. Настоящий ИИ ещё не подключён.');$('question').value=''});$('infoClose').addEventListener('click',()=>$('info').close());
const fab=$('assistantButton'),inputPanel=$('ask'),hint=$('voiceHint');let holdTimer=null,held=false,started=false,recognition=null,suppressClick=false;
function setHint(value){hint.textContent=value}
function stopVoice(){if(recognition){try{recognition.stop()}catch{}recognition=null}fab.classList.remove('listening')}
function startVoice(){started=true;held=true;const Speech=window.SpeechRecognition||window.webkitSpeechRecognition;if(!Speech){setHint('Распознавание речи недоступно в этом браузере. Нажмите, чтобы написать.');return}try{const sr=new Speech();recognition=sr;sr.lang='ru-RU';sr.interimResults=false;sr.continuous=false;sr.onresult=e=>{const phrase=Array.from(e.results).map(r=>r[0]?.transcript||'').join(' ').trim();if(phrase){inputPanel.hidden=false;$('question').value=phrase;setHint('Речь распознана. Проверьте текст перед отправкой.')}};sr.onerror=e=>setHint('Голосовой ввод: '+(e.error==='not-allowed'?'нет разрешения на микрофон':e.error));sr.onend=()=>{fab.classList.remove('listening');recognition=null};sr.start();fab.classList.add('listening');setHint('Слушаю… отпустите, чтобы закончить')}catch{setHint('Не удалось включить голосовой ввод. Используйте текст.')}} 
fab.addEventListener('pointerdown',e=>{if(e.button!==0)return;started=false;held=false;clearTimeout(holdTimer);holdTimer=setTimeout(startVoice,500)});
function endPress(){clearTimeout(holdTimer);if(held){suppressClick=true;setTimeout(()=>suppressClick=false,350);stopVoice();held=false}}
fab.addEventListener('pointerup',endPress);fab.addEventListener('pointercancel',endPress);fab.addEventListener('pointerleave',endPress);
fab.addEventListener('contextmenu',e=>e.preventDefault());
fab.addEventListener('click',()=>{if(suppressClick||started){started=false;return}inputPanel.hidden=!inputPanel.hidden;if(!inputPanel.hidden){$('question').focus();setHint('Поле для сообщения открыто')}else setHint('Нажмите — написать · удерживайте — говорить')});
$('hideInput').addEventListener('click',()=>{inputPanel.hidden=true;setHint('Нажмите — написать · удерживайте — говорить')});
render()})();
</script></body></html>
