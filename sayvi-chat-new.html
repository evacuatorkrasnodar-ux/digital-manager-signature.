<script>
/* Read the same persisted theme as the SEYVEO Home before first paint. */
(function(){
 const key='dm-signature-living-v2';
 const previous='dm-signature-living-v1';
 const allowed=['auto','graphite','light','dark','sapphire','plum'];
 const browserTheme=window.matchMedia('(prefers-color-scheme: dark)');
 function chosen(){
  let value='graphite';
  try{
   const saved=JSON.parse(localStorage.getItem(key)||'null')
    ||JSON.parse(localStorage.getItem(previous)||'null');
   if(saved&&allowed.includes(saved.theme))value=saved.theme;
  }catch{}
  return value==='auto'?(browserTheme.matches?'graphite':'light'):value;
 }
 function sync(){
  const selected=chosen(),isLight=selected==='light';
  const palette=isLight?'white':selected==='graphite'?'graphite':selected==='sapphire'?'sapphire':selected==='plum'?'plum':'emerald';
  document.documentElement.dataset.theme=isLight?'light':'dark';
  document.documentElement.dataset.palette=palette;
  document.querySelector('meta[name="theme-color"]').content=
   isLight?'#f9fafb':palette==='graphite'?'#11161b':palette==='sapphire'?'#101724':palette==='plum'?'#1c1b1a':'#111917';
 }
 sync();
 window.addEventListener('storage',e=>{if(!e.key||e.key===key||e.key===previous)sync()});
 window.addEventListener('pageshow',sync);
 window.addEventListener('focus',sync);
 document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});
 if(browserTheme.addEventListener)browserTheme.addEventListener('change',sync);
 else if(browserTheme.addListener)browserTheme.addListener(sync);
})();
</script>
<title>Сэйви · SEYVEO</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#11161b;color:#fff}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
main{position:fixed;left:0;right:0;top:var(--sayvi-viewport-top,0px);height:var(--sayvi-viewport-height,100dvh);background:linear-gradient(180deg,#0e1419 0%,#141b21 28%,#1b252d 55%,#212d36 78%,#10161b 100%);display:flex;flex-direction:column;overflow:hidden}

/* Тестовые сообщения: никакой поверхности и фона у области переписки. */

   Messages remain fully scrollable; no forced scrolling or data changes. */
#sayviMessages{
 scroll-padding-top:calc(env(safe-area-inset-top) + 8px);
}
#sayviMessages.is-scrolled{
 -webkit-mask-image:linear-gradient(to bottom,transparent 0,black 23px,black 100%);
 mask-image:linear-gradient(to bottom,transparent 0,black 23px,black 100%);
}
.turn{display:flex;flex-direction:column;gap:5px;margin:0 0 18px;font-size:15px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.turn[data-role="user"]{align-items:flex-end}

   conversational silhouette instead of a rectangular card. */
.turn[data-role="user"] .bubble{
 padding:10px 14px;
 border-radius:21px 21px 8px 21px;
 background:var(--sayvi-glass);
 color:var(--sayvi-text);
 max-width:min(85%,520px);
 border:0;
 box-shadow:none;
 -webkit-backdrop-filter:blur(16px) saturate(105%);
 backdrop-filter:blur(16px) saturate(105%);
}
.turn[data-role="assistant"] .bubble{max-width:100%}
.speaker{font-size:11px;color:#a5b0b7}
/* A soft left-to-right sheen across Sayvi's name only while a reply is
   pending. It is not a message bubble, spinner or persistent decoration. */
.sayvi-thinking{align-items:flex-start}
.sayvi-thinking .sayvi-thinking-label{
 font-size:15px;font-weight:590;line-height:1.45;letter-spacing:-.012em;
 color:var(--sayvi-secondary);
 background:linear-gradient(105deg,var(--sayvi-secondary) 0%,var(--sayvi-secondary) 34%,var(--sayvi-text) 49%,var(--sayvi-secondary) 64%,var(--sayvi-secondary) 100%);
 background-size:230% 100%;background-position:100% 50%;
 -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
 animation:sayvi-name-sheen 2.1s ease-in-out infinite;
}
@keyframes sayvi-name-sheen{from{background-position:100% 50%}to{background-position:0% 50%}}
@media(prefers-reduced-motion:reduce){
 .sayvi-thinking .sayvi-thinking-label{animation:none;background:none;-webkit-text-fill-color:currentColor}
}
/* Независимые элементы в одной строке: никакой общей подложки. */
#sayviComposer{position:absolute;left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));bottom:calc(10px + env(safe-area-inset-bottom));display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;gap:8px;background:transparent;border:0;box-shadow:none;z-index:5}
#sayviField{display:block;position:relative;min-width:0;height:44px;background:transparent;border:0;box-shadow:none}
/* iOS 26-inspired matte Liquid Glass: material belongs to each control only.

#sayviInput{display:block;width:100%;height:44px;min-height:44px;max-height:44px;box-sizing:border-box;margin:0;padding:10px 15px;border:0;border-radius:22px;background:linear-gradient(150deg,rgba(230,241,249,.14),rgba(175,204,222,.075) 65%,rgba(205,224,238,.095));-webkit-backdrop-filter:blur(18px) saturate(145%);backdrop-filter:blur(18px) saturate(145%);color:#f7fafc;box-shadow:none;outline:none;resize:none;font:400 16px/24px -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-appearance:none;appearance:none}

#sayviMic,#sayviSend,#sayviPlus{position:static;display:grid;place-items:center;width:44px;height:44px;min-width:44px;margin:0;padding:0;border:0;border-radius:50%;background:linear-gradient(155deg,rgba(230,241,249,.15),rgba(175,204,222,.075) 65%,rgba(205,224,238,.09));-webkit-backdrop-filter:blur(18px) saturate(145%);backdrop-filter:blur(18px) saturate(145%);color:#f7fafc;box-shadow:none;outline:0;-webkit-appearance:none;appearance:none}
#sayviMic:active,#sayviSend:active,#sayviPlus:active{background:rgba(218,235,245,.20)}
@media(prefers-reduced-transparency:reduce){
 #sayviInput,#sayviMic,#sayviSend,#sayviPlus{background:#2a353d;-webkit-backdrop-filter:none;backdrop-filter:none}
}
#sayviMic{font-size:0;line-height:1}
/* Dictation material: a single light pill with an iOS-inspired animated waveform. */
#sayviMic{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#sayviMic.is-recording{background:var(--sayvi-pressed)}
#sayviSpeechBar{
 position:absolute;z-index:7;
 left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));
 bottom:calc(64px + env(safe-area-inset-bottom));height:46px;padding:4px 6px 4px 12px;

 box-shadow:none;
}
#sayviSpeechBar[hidden]{display:none!important}
.sv-speech-dot{flex:0 0 7px;width:7px;height:7px;border-radius:50%;background:#cb5656}
.sv-speech-wave{flex:1 1 auto;display:flex;align-items:center;justify-content:center;gap:2.5px;height:24px;min-width:10px;overflow:hidden}
.sv-speech-wave i{display:block;width:1.5px;height:5px;flex:0 0 1.5px;border-radius:99px;background:currentColor;opacity:.55;animation:sv-wave 950ms ease-in-out infinite alternate}
.sv-speech-wave i:nth-child(4n+1){animation-delay:-550ms}
.sv-speech-wave i:nth-child(4n+2){animation-delay:-200ms}
.sv-speech-wave i:nth-child(4n+3){animation-delay:-720ms}
.sv-speech-wave i:nth-child(5n){animation-duration:670ms}
#sayviSpeechBar[data-state="processing"] .sv-speech-wave i{animation:none;height:4px;opacity:.35}
@keyframes sv-wave{0%,100%{height:3px;opacity:.35}50%{height:17px;opacity:.85}}
.sv-speech-time{min-width:32px;flex:none;font:400 12px -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;font-variant-numeric:tabular-nums;color:var(--sayvi-secondary)}
#sayviSpeechBar button{flex:0 0 34px;width:34px;height:34px;display:grid;place-items:center;border:0;border-radius:50%;padding:0;background:transparent;color:var(--sayvi-control-text)}
#sayviSpeechBar button:last-child{background:var(--sayvi-action)}
#sayviSpeechDone .sv-stop-square{width:10px;height:10px;border-radius:2.5px;background:currentColor;display:block}
#sayviSpeechBar button svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}
#sayviSpeechBar button:active{background:var(--sayvi-pressed)}
@media(prefers-reduced-motion:reduce){.sv-speech-wave i{animation:none;height:7px}}
@media(prefers-reduced-transparency:reduce){#sayviSpeechBar{background:var(--sayvi-fallback);-webkit-backdrop-filter:none;backdrop-filter:none}}
#sayviMic svg{display:block;width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}
#sayviMic,#sayviSend{grid-column:3;grid-row:1}
#sayviMic[hidden],#sayviSend[hidden]{display:none!important}
#sayviSend svg,#sayviPlus svg{display:block;width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}
#sayviMenu{z-index:6}
#sayviMenu[hidden]{display:none}
#sayviMenu{position:absolute;left:max(12px,env(safe-area-inset-left));bottom:calc(62px + env(safe-area-inset-bottom));min-width:175px;padding:5px;border-radius:15px;background:#263039}
#sayviMenu button{display:block;width:100%;border:0;border-radius:10px;background:transparent;color:#fff;padding:11px 12px;text-align:left;font:inherit}
#sayviMenu button:active{background:rgba(255,255,255,.08)}

#sayviStatus{position:absolute;z-index:6;left:64px;right:12px;bottom:calc(62px + env(safe-area-inset-bottom));font-size:12px;line-height:1.4;color:#a5b0b7;pointer-events:none;background:transparent}
#sayviStatus:empty{display:none}
#sayviHistory[hidden]{display:none!important}
#sayviHistory{position:fixed;z-index:8;inset:0;overflow-y:auto;background:#11161b;padding:calc(14px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));color:#fff}
.history-head{height:46px;display:flex;align-items:center;justify-content:space-between;font-size:18px}
.history-head button{background:transparent;color:#dbe5eb;border:0;padding:10px;font:inherit;font-size:14px}
#sayviHistoryList{display:flex;flex-direction:column;gap:5px;margin:18px auto 0;max-width:720px}
.history-item{border:0;border-radius:14px;background:#263039;color:#fff;padding:14px;text-align:left;font:inherit;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.history-empty{color:#a5b0b7;font-size:14px;text-align:center;margin-top:60px}
/* Floating navigation only: no full-width header, glass in the existing
   SEYVEO palette. The conversation scrolls independently behind these controls. */
#sayviTopActions{
 position:absolute;z-index:7;
 top:calc(env(safe-area-inset-top) + 7px);
 left:max(12px,env(safe-area-inset-left));
 right:max(12px,env(safe-area-inset-right));
 display:flex;justify-content:space-between;align-items:center;
 pointer-events:none;
}
#sayviTopActions .sv-top-name{

 max-width:calc(100% - 104px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;

 letter-spacing:-.02em;color:var(--sayvi-text);pointer-events:none;
}
#sayviTopActions .sv-top-action{
 pointer-events:auto;display:inline-flex;align-items:center;justify-content:center;
 width:42px;height:42px;min-width:42px;min-height:42px;padding:0;
 border:0;border-radius:999px;
 background:var(--sayvi-glass);color:var(--sayvi-control-text);
 -webkit-backdrop-filter:blur(16px) saturate(105%);
 backdrop-filter:blur(16px) saturate(105%);
 box-shadow:none;outline-offset:3px;font:500 13px/1 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
 text-decoration:none;-webkit-tap-highlight-color:transparent;
}
#sayviTopActions .sv-top-action svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}
#sayviTopActions .sv-top-action:active{background:var(--sayvi-pressed)}
:root[data-theme=light] #sayviTopActions .sv-top-action{
 -webkit-backdrop-filter:blur(14px) saturate(115%) contrast(1.12);
 backdrop-filter:blur(14px) saturate(115%) contrast(1.12);
}
@media(prefers-reduced-transparency:reduce){
 #sayviTopActions .sv-top-action{background:var(--sayvi-fallback);-webkit-backdrop-filter:none;backdrop-filter:none}
}
#sayviInput:disabled{opacity:.75}

/* Same SEYVEO theme system as Home; only colors/materials change.
   No alterations to composer dimensions, behavior or message scrolling. */
:root{
 --sayvi-bg:#11161b;
 --sayvi-scene:linear-gradient(180deg,#0e1419 0%,#141b21 28%,#1b252d 55%,#212d36 78%,#10161b 100%);
 --sayvi-text:#fff;
 --sayvi-secondary:#a5b0b7;
 --sayvi-bubble:#263039;
 /* Flat neutral smoke on all dark palettes, not a blue/green gradient.
    The blurred background remains visible through the material. */
 --sayvi-glass:rgba(184,195,201,.19);
 --sayvi-action:rgba(184,195,201,.19);
 --sayvi-control-text:#f7fafc;
 --sayvi-placeholder:rgba(228,235,241,.70);
 --sayvi-pressed:rgba(218,235,245,.20);
 --sayvi-menu:#263039;
 --sayvi-menu-pressed:rgba(255,255,255,.08);
 --sayvi-fallback:#2a353d;
}
:root[data-theme=light]{
 color-scheme:light;
 --sayvi-bg:#ffffff;
 --sayvi-scene:#ffffff;
 --sayvi-text:#242a31;
 --sayvi-secondary:#637178;
 --sayvi-bubble:rgba(219,230,232,.69);
 /* Consistently smoke-gray translucent glass, including over empty pearl
    background. Keep the native blur, no border, glow or raised shadows. */
 --sayvi-glass:rgba(99,121,133,.22);

}
/* Both contrast modes share the same flat smoke-glass principle.

:root[data-theme=dark][data-palette=emerald]{
 --sayvi-bg:#111917;

}
:root[data-theme=dark][data-palette=sapphire]{

}
:root[data-theme=dark][data-palette=plum]{

 --sayvi-glass:rgba(184,195,201,.19);

}

main{background:var(--sayvi-scene)}
.turn[data-role="user"] .bubble{background:var(--sayvi-glass);color:var(--sayvi-text)}
@media(prefers-reduced-transparency:no-preference){
 :root[data-theme=light] .turn[data-role="user"] .bubble{
  -webkit-backdrop-filter:blur(14px) saturate(115%) contrast(1.12);
  backdrop-filter:blur(14px) saturate(115%) contrast(1.12);
 }
}
@media(prefers-reduced-transparency:reduce){
 .turn[data-role="user"] .bubble{
  background:var(--sayvi-fallback);
  -webkit-backdrop-filter:none;
  backdrop-filter:none;
 }
}
.turn[data-role="assistant"] .bubble{color:var(--sayvi-text)}
.speaker,#sayviStatus,.history-empty{color:var(--sayvi-secondary)}
#sayviInput{background:var(--sayvi-glass);color:var(--sayvi-control-text)}
#sayviInput::placeholder{color:var(--sayvi-placeholder)}
#sayviMic,#sayviSend,#sayviPlus{background:var(--sayvi-action);color:var(--sayvi-control-text)}
/* White Velvet: tune backdrop pixels, not the glass fill or edge.
   Preserve original geometry, gradient, shadows:none and dark materials. */

 :root[data-theme=light] #sayviInput,
 :root[data-theme=light] #sayviMic,
 :root[data-theme=light] #sayviSend,

  -webkit-backdrop-filter:blur(14px) saturate(115%) contrast(1.12);
  backdrop-filter:blur(14px) saturate(115%) contrast(1.12);
 }
}
/* The bottom of the dark scene is deeper than the recording preview.
   Lift only the input pill slightly so its perceived smoke tone matches. */

 background:rgba(184,195,201,.25);
}
/* On dark palettes suppress color amplification: matte, not glossy.
   No strokes, highlights or outer shadows; original shape and sizing stay. */
@media(prefers-reduced-transparency:no-preference){
 :root[data-theme=dark] #sayviInput,
 :root[data-theme=dark] #sayviMic,

  backdrop-filter:blur(16px) saturate(105%);
 }
}

#sayviMenu{background:var(--sayvi-menu);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}

#sayviMenu button:active{background:var(--sayvi-menu-pressed)}

 #sayviInput,#sayviMic,#sayviSend,#sayviPlus{background:var(--sayvi-fallback);-webkit-backdrop-filter:none;backdrop-filter:none}

<script>
(()=>{
 'use strict';
 const input=document.getElementById('sayviInput'),list=document.getElementById('sayviMessages');
 // Keep the full-screen scene aligned to the visible viewport on iOS Safari.
 // Only the messages scroll; composer/menu remain anchored to the scene.
 const scene=document.querySelector('main');
 let viewportFrame=0;
 function fitVisibleViewport(){
  if(viewportFrame)return;
  viewportFrame=requestAnimationFrame(()=>{
   viewportFrame=0;
   const vv=window.visualViewport;
   if(vv){
    scene.style.setProperty('--sayvi-viewport-top',vv.offsetTop+'px');
    scene.style.setProperty('--sayvi-viewport-height',vv.height+'px');
   }else{
    scene.style.setProperty('--sayvi-viewport-top','0px');
    scene.style.setProperty('--sayvi-viewport-height',window.innerHeight+'px');
   }
  });
 }
 fitVisibleViewport();
 window.visualViewport?.addEventListener('resize',fitVisibleViewport,{passive:true});
 window.visualViewport?.addEventListener('scroll',fitVisibleViewport,{passive:true});
 window.addEventListener('resize',fitVisibleViewport,{passive:true});
 // Fade older messages only after scrolling; the first visible line stays crisp.
 const updateScrollEdge=()=>list.classList.toggle('is-scrolled',list.scrollTop>2);
 list.addEventListener('scroll',updateScrollEdge,{passive:true});
 const mic=document.getElementById('sayviMic'),sendButton=document.getElementById('sayviSend');
 const plus=document.getElementById('sayviPlus'),menu=document.getElementById('sayviMenu');
 const status=document.getElementById('sayviStatus');
 let active=null,sequence=0;
 const historyTurns=[];
 const answers=new Map();
 const storageKey='seyveo.sayvi.conversations.v1';
 let archive=[],currentId='conversation-'+Date.now(),savedTurns=[];
 function persist(){
  try{localStorage.setItem(storageKey,JSON.stringify({archive:archive.slice(0,40),currentId,turns:savedTurns.slice(-120)}));}
  catch(error){status.textContent='Историю не удалось сохранить на этом устройстве.';}
 }
 function snapshot(){
  return {id:currentId,updated:Date.now(),turns:savedTurns.slice(-120)};
 }
 function renderTurns(turns){
  answers.clear();list.replaceChildren();savedTurns=[];
  for(const turn of turns){
   if(!turn||!['user','assistant'].includes(turn.role)||typeof turn.text!=='string')continue;
   append(turn.role,'loaded-'+savedTurns.length,turn.text,false);
  }
  historyTurns.length=0;
  for(const turn of savedTurns.slice(-12)){
   if(turn.role==='user'||turn.role==='assistant')historyTurns.push({role:turn.role,content:turn.text.slice(0,450)});
  }
  requestAnimationFrame(()=>{list.scrollTop=list.scrollHeight;updateScrollEdge()});
 }
 function restore(){
  try{
   const data=JSON.parse(localStorage.getItem(storageKey)||'null');
   if(!data||typeof data!=='object')return;
   archive=Array.isArray(data.archive)?data.archive.filter(item=>item&&Array.isArray(item.turns)).slice(0,40):[];
   currentId=typeof data.currentId==='string'?data.currentId:currentId;
   if(Array.isArray(data.turns))renderTurns(data.turns);
  }catch{status.textContent='Не удалось прочитать сохранённую историю.'}
 }
 const historyTop=document.getElementById('sayviHistoryTop');
 const historyPanel=document.getElementById('sayviHistory');
 const historyList=document.getElementById('sayviHistoryList');
 function closeHistory(){historyPanel.hidden=true;historyTop.setAttribute('aria-expanded','false')}
 function openHistory(){
  closeMenu();historyList.replaceChildren();
  const conversations=[snapshot(),...archive].filter(item=>item.turns.length);
  for(const item of conversations){
   const first=item.turns.find(turn=>turn.role==='user')?.text||'Разговор с Сэйви';
   const button=document.createElement('button');
   button.className='history-item';button.type='button';button.textContent=first.slice(0,90);
   button.addEventListener('click',()=>{
    if(active)return;
    if(item.id!==currentId){
     if(savedTurns.length)archive.unshift(snapshot());
     archive=archive.filter(entry=>entry.id!==item.id).slice(0,40);
     currentId=item.id;renderTurns(item.turns);persist();
    }
    closeHistory();
   });
   historyList.append(button);
  }
  if(!conversations.length){const empty=document.createElement('p');empty.className='history-empty';empty.textContent='История разговоров пока пуста';historyList.append(empty)}
  historyPanel.hidden=false;historyTop.setAttribute('aria-expanded','true');
 }
 historyTop.addEventListener('click',openHistory);
 document.getElementById('sayviHistoryOpen').addEventListener('click',openHistory);
 document.getElementById('sayviHistoryClose').addEventListener('click',closeHistory);
 document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!historyPanel.hidden)closeHistory()});
 function updateControls(){
  const typed=!!input.value.trim();
  input.disabled=!!active;
  sendButton.hidden=!!active||!typed;
  mic.hidden=!!active||typed;
 }
 function append(role,id,message,save=true){
  const nearBottom=list.scrollHeight-list.scrollTop-list.clientHeight<100;
  let bubble=answers.get(id);
  if(!bubble){
   const turn=document.createElement('div');
   turn.className='turn';turn.dataset.role=role;
   if(role==='assistant'){
    const title=document.createElement('span');
    title.className='speaker';title.textContent='Сэйви';turn.append(title);
   }
   bubble=document.createElement('div');bubble.className='bubble';
   turn.append(bubble);list.append(turn);answers.set(id,bubble);
  }
  bubble.textContent=message;
  if(save){
   const index=Number(bubble.dataset.savedIndex);
   if(Number.isInteger(index)&&index>=0&&index<savedTurns.length){savedTurns[index].text=message;}
   else{bubble.dataset.savedIndex=String(savedTurns.length);savedTurns.push({role,text:message});}
   persist();
  }else{bubble.dataset.savedIndex=String(savedTurns.length);savedTurns.push({role,text:message});}
  if(nearBottom)requestAnimationFrame(()=>{list.scrollTop=list.scrollHeight;updateScrollEdge()});
 }
 function showThinking(){
  const turn=document.createElement('div');
  turn.className='turn sayvi-thinking';
  turn.setAttribute('role','status');
  turn.setAttribute('aria-label','Сэйви думает');
  const label=document.createElement('span');
  label.className='sayvi-thinking-label';
  label.textContent='Сэйви';
  turn.append(label);
  list.append(turn);
  requestAnimationFrame(()=>{list.scrollTop=list.scrollHeight;updateScrollEdge()});
  return ()=>turn.remove();
 }
 function closeMenu(){menu.hidden=true;plus.setAttribute('aria-expanded','false')}
 plus.addEventListener('click',()=>{menu.hidden=!menu.hidden;plus.setAttribute('aria-expanded',String(!menu.hidden))});
 document.getElementById('sayviNewChat').addEventListener('click',()=>{
  active?.abort();active=null;
  ++speechGeneration;speechAborted=true;
  try{speechSession?.abort()}catch{}
  speechSession=null;clearSpeech();
  if(savedTurns.length)archive.unshift(snapshot());
  archive=archive.slice(0,40);currentId='conversation-'+Date.now();savedTurns=[];
  historyTurns.length=0;answers.clear();
  list.replaceChildren();list.scrollTop=0;updateScrollEdge();input.value='';status.textContent='';closeMenu();persist();updateControls();input.focus();
 });
 document.addEventListener('pointerdown',e=>{
  if(!menu.hidden&&!e.target.closest('#sayviPlus,#sayviMenu'))closeMenu();
 });
 async function ask(question){
  const controller=new AbortController();active=controller;updateControls();
  status.textContent='';
  const id=++sequence,replyId='reply-'+id;
  append('user','user-'+id,question);
  let answer='',done=false;
  const thinkingStarted=performance.now();
  const stopThinking=showThinking();
  // A network error on static GitHub Pages can arrive in a few milliseconds.
  // Give the animation one visible pass, without implying a real AI reply.
  async function finishThinking(){
   const remaining=1300-(performance.now()-thinkingStarted);
   if(remaining>0)await new Promise(resolve=>setTimeout(resolve,remaining));
   stopThinking();
  }
  try{
   const response=await fetch('/api/seyveo-stream',{
    method:'POST',credentials:'same-origin',
    headers:{'content-type':'application/json'},
    body:JSON.stringify({message:question,history:historyTurns.slice(-6)}),
    signal:controller.signal
   });
   if(!response.ok){
    if(response.status===404||response.status===405)throw Error('Для живых ответов Сэйви нужно подключение сервера ИИ. На GitHub Pages он недоступен.');
    const body=await response.json().catch(()=>({}));
    throw Error(body.error||'Не удалось получить ответ Сэйви.');
   }
   if(!response.body)throw Error('Браузер не поддерживает потоковые ответы.');
   const reader=response.body.getReader(),decoder=new TextDecoder();
   let buffer='';
   function consume(line){
    if(!line.trim())return;
    const part=JSON.parse(line);
    if(part.type==='delta'&&typeof part.text==='string'){
     if(!answer)stopThinking();
     answer+=part.text;append('assistant',replyId,answer);
    }else if(part.type==='done')done=true;
    else if(part.type==='error')throw Error(part.text||'Ошибка ответа Сэйви.');
   }
   while(true){
    const chunk=await reader.read();
    if(chunk.done)break;
    buffer+=decoder.decode(chunk.value,{stream:true});
    let n;
    while((n=buffer.indexOf('\n'))!==-1){
     consume(buffer.slice(0,n));buffer=buffer.slice(n+1);
    }
   }
   buffer+=decoder.decode();
   if(buffer.trim())consume(buffer);
   if(!done)throw Error('Соединение прервалось.');
   if(!answer.trim())throw Error('Сэйви не прислала ответ.');
   historyTurns.push({role:'user',content:question.slice(0,250)},{role:'assistant',content:answer.slice(0,450)});
   if(historyTurns.length>12)historyTurns.splice(0,historyTurns.length-12);
  }catch(error){
   if(controller.signal.aborted)return;
   status.textContent=String(error?.message||'Ошибка соединения.');
   if(answer)append('assistant',replyId,answer);
  }finally{
   await finishThinking();
   if(active===controller){active=null;updateControls()}
  }
 }
 function send(){
  const value=input.value.trim();if(!value||active)return;
  input.value='';updateControls();ask(value);
 }
 sendButton.addEventListener('click',send);
 input.addEventListener('input',updateControls);
 input.addEventListener('keydown',event=>{
  if(event.key==='Enter'&&!event.shiftKey&&!event.isComposing){
   event.preventDefault();send();
  }
 });
 // Hold to record using the browser's real microphone.
 // This static prototype has no server-side audio delivery yet.
 // Speech-to-text: no recorded audio bubble appears in the conversation.
 const speechBar=document.getElementById('sayviSpeechBar');
 const speechTime=document.getElementById('sayviSpeechTime');
 const SpeechApi=window.SpeechRecognition||window.webkitSpeechRecognition;
 let speechSession=null,spokenFinal='',spokenInterim='',speechStart=0,speechTimer=null;
 let speechGeneration=0,speechAborted=false,speechStopping=false;
 function updateSpeechClock(){
  const seconds=Math.floor((performance.now()-speechStart)/1000);
  speechTime.textContent=Math.floor(seconds/60)+':'+String(seconds%60).padStart(2,'0');
 }
 function clearSpeech(){
  clearInterval(speechTimer);speechTimer=null;speechBar.hidden=true;
  speechBar.removeAttribute('data-state');mic.classList.remove('is-recording');
  mic.setAttribute('aria-label','Начать голосовой ввод');
  spokenFinal='';spokenInterim='';speechStopping=false;
 }
 function cancelSpeech(){
  speechAborted=true;++speechGeneration;
  const old=speechSession;speechSession=null;
  try{old?.abort()}catch{}
  clearSpeech();status.textContent='Голосовой ввод отменён.';
 }
 function completeSpeech(generation){
  if(generation!==speechGeneration||speechAborted)return;
  const text=(spokenFinal||spokenInterim).trim();
  speechSession=null;clearSpeech();
  if(text)ask(text);
  else status.textContent='Не удалось распознать речь. Попробуйте ещё раз или используйте диктовку клавиатуры iPhone.';
 }
 function stopSpeech(){
  if(!speechSession||speechStopping)return;
  speechStopping=true;speechBar.dataset.state='processing';
  const generation=speechGeneration;
  try{speechSession.stop()}catch{}
  setTimeout(()=>{if(generation===speechGeneration&&speechSession)completeSpeech(generation)},1400);
 }
 function startSpeech(){
  if(speechSession){stopSpeech();return}
  if(active||input.value.trim())return;
  status.textContent='';
  if(!SpeechApi){
   status.textContent='В этом браузере нет распознавания речи. Можно использовать микрофон клавиатуры iPhone.';
   return;
  }
  let r;try{r=new SpeechApi()}catch{status.textContent='Голосовой ввод недоступен.';return}
  speechAborted=false;speechStopping=false;
  const generation=++speechGeneration;
  speechSession=r;spokenFinal='';spokenInterim='';
  r.lang='ru-RU';r.continuous=false;r.interimResults=true;r.maxAlternatives=1;
  r.onresult=event=>{
   if(generation!==speechGeneration)return;
   let final='',interim='';
   for(let i=0;i<event.results.length;i++){
    const transcript=event.results[i][0]?.transcript||'';
    if(event.results[i].isFinal)final+=transcript+' ';
    else interim+=transcript+' ';
   }
   spokenFinal=final.trim();spokenInterim=interim.trim();
  };
  r.onerror=event=>{
   if(generation!==speechGeneration)return;
   const code=event.error||'unknown';
   speechAborted=true;++speechGeneration;speechSession=null;clearSpeech();
   status.textContent=code==='not-allowed'||code==='service-not-allowed'
    ?'Разрешите доступ к микрофону и распознаванию речи в Safari.'
    :code==='no-speech'?'Речь не распознана. Попробуйте ещё раз.'
    :'Не удалось распознать речь ('+code+'). Можно воспользоваться диктовкой клавиатуры iPhone.';
  };
  r.onend=()=>completeSpeech(generation);
  speechStart=performance.now();updateSpeechClock();
  speechBar.hidden=false;mic.classList.add('is-recording');
  mic.setAttribute('aria-label','Завершить голосовой ввод');
  speechTimer=setInterval(updateSpeechClock,250);
  try{r.start()}catch{
   ++speechGeneration;speechSession=null;clearSpeech();
   status.textContent='Не удалось запустить распознавание речи в Safari.';
  }
 }
 mic.addEventListener('click',startSpeech);
 document.getElementById('sayviSpeechDone').addEventListener('click',stopSpeech);
 document.getElementById('sayviSpeechCancel').addEventListener('click',cancelSpeech);
 window.addEventListener('pagehide',()=>{
  ++speechGeneration;try{speechSession?.abort()}catch{}
  speechSession=null;clearSpeech();
 });
 restore();
 updateControls();
})();
</script>
</body>
