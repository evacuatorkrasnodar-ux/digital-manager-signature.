name: SEYVEO Agent Core Safety Checks
on:
  push:
    branches: [main]
    paths:
      - 'server/agent/**'
      - 'server/intelligence/**'
      - 'server/tests/intelligence-architecture.test.mjs'
      - 'server/tests/business-math.test.mjs'
      - 'server/felix-school/**'
      - 'server/hybrid-core.mjs'
      - 'server/tests/felix-persona.test.mjs'
      - 'server/tests/felix-batch2.test.mjs'
      - 'server/tests/felix-batch3.test.mjs'
      - 'server/tests/felix-batch4.test.mjs'
      - 'server/tests/felix-batch5.test.mjs'
      - 'server/tests/lesson-coach.test.mjs'
      - 'server/providers.mjs'
      - 'server/local-stream.mjs'
      - 'server/tests/research-school.test.mjs'
      - 'server/tests/agent-planner.test.mjs'
      - 'server/tests/code-review.test.mjs'
      - 'server/tests/real-app-local.test.mjs'
      - 'server/tests/iphone-private-gateway.test.mjs'
      - 'server/real-app-local.mjs'
      - 'server/http.mjs'
      - 'server/iphone-private-gateway.mjs'
      - '.github/workflows/agent-core.yml'
  pull_request:
    paths:
      - 'server/agent/**'
      - 'server/intelligence/**'
      - 'server/tests/intelligence-architecture.test.mjs'
      - 'server/tests/business-math.test.mjs'
      - 'server/felix-school/**'
      - 'server/hybrid-core.mjs'
      - 'server/tests/felix-persona.test.mjs'
      - 'server/tests/felix-batch2.test.mjs'
      - 'server/tests/felix-batch3.test.mjs'
      - 'server/tests/felix-batch4.test.mjs'
      - 'server/tests/felix-batch5.test.mjs'
      - 'server/tests/lesson-coach.test.mjs'
      - 'server/providers.mjs'
      - 'server/local-stream.mjs'
      - 'server/tests/research-school.test.mjs'
      - 'server/tests/agent-planner.test.mjs'
      - 'server/tests/code-review.test.mjs'
      - 'server/tests/real-app-local.test.mjs'
      - 'server/tests/iphone-private-gateway.test.mjs'
      - 'server/real-app-local.mjs'
      - 'server/http.mjs'
      - 'server/iphone-private-gateway.mjs'
      - '.github/workflows/agent-core.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  agent-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Felix persona, safety, batch 2 and dialogue guidance tests
        run: node --test server/tests/felix-persona.test.mjs server/tests/felix-batch2.test.mjs server/tests/felix-batch3.test.mjs server/tests/felix-batch4.test.mjs server/tests/felix-batch5.test.mjs server/tests/felix-school.test.mjs server/tests/core.test.mjs
      - name: Lesson coach and local streaming tests
        run: node --test server/tests/lesson-coach.test.mjs server/tests/local-stream.test.mjs
      - name: Felix batch 2 offline exam readiness
        run: node server/felix-school/evaluate.mjs --suite=batch2 --limit=20
      - name: Felix judgment batch 5 offline exam readiness
        run: node server/felix-school/evaluate.mjs --suite=batch5 --limit=12
      - name: Felix business batch 4 offline exam readiness
        run: node server/felix-school/evaluate.mjs --suite=batch4 --limit=12
      - name: Felix batch 3 multi-turn offline exam readiness
        run: node server/felix-school/evaluate-dialogue.mjs --limit=12
      - name: Felix deterministic business calculator unit tests
        run: node --test server/tests/business-math.test.mjs
      - name: Felix offline business calculator demonstration
        run: node server/intelligence/business-math-demo.mjs
      - name: Agent planning and read-only code review tests
        run: node --test server/tests/agent-planner.test.mjs server/tests/code-review.test.mjs server/tests/intelligence-architecture.test.mjs server/tests/research-school.test.mjs
      - name: Real application and private iPhone agent route checks
        run: node --test server/tests/real-app-local.test.mjs server/tests/iphone-private-gateway.test.mjs
      - name: Static agent CLI smoke test
        run: node server/agent/try-agent.mjs "Создай встречу завтра в 12:00"
      - name: Code review CLI smoke test
        run: node server/agent/check-code.mjs server/agent/planner.mjs
      - name: Felix research school offline preview (no web access)
        run: node server/intelligence/study.mjs --source=web-standards
