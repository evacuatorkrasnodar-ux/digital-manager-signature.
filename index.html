(()=>{'use strict';
const KEY='dm-signature-living-v2',OLD_KEY='dm-signature-living-v1', $=id=>document.getElementById(id);
const stories=[
{type:'mail',icon:'✉',kicker:'Нужно ваше решение',title:'Роман, клиент ждёт ответа',subtitle:'Проверил условия и подготовил предложение. Осталось ваше согласование.',card:'Ответ клиенту',meta:'Компания «Альфа» · запрос предложения',tag:'Черновик ответа готов к согласованию',approve:'Согласовать ответ',approved:'Ответ клиенту согласован',detail:'Клиент запросил стоимость и сроки запуска проекта.\n\nПредлагаемый ответ:\n«Добрый день! Подготовили предварительное предложение. Можем обсудить детали завтра после 12:00. Подтвердите, пожалуйста, удобное время».\n\nВ этом сценарии сообщение не отправляется.'},

{type:'budget',icon:'◈',kicker:'Нашёл возможность сэкономить',title:'Роман, расходы на рекламу растут',subtitle:'Проверил показатели. Есть предложение, как вернуть бюджет под контроль.',card:'Рекламный бюджет',meta:'Рост расходов +18% · пример аналитики',tag:'Изменение лимита только после согласования',approve:'Согласовать лимит',approved:'Лимит расходов согласован',detail:'В вымышленном отчёте расходы на рекламу выросли на 18%, а количество обращений осталось прежним.\n\nПредлагаю временно снизить дневной лимит на 10% и проверить результат через три дня.\n\nНикаких реальных рекламных кампаний или платежей приложение не меняет.'}

$('resolve')?.addEventListener('click',()=>approve(story));
const items=state.history.slice(-3).reverse();
$('activityList').innerHTML=items.length?items.map(h=>'<div class="activity-row"><span class="activity-icon" aria-hidden="true">✓</span><span class="activity-title">'+escapeHtml(h.label)+'</span><span class="activity-meta">'+escapeHtml(h.time)+'</span></div>').join(''):'<div class="activity-row"><span class="activity-icon" aria-hidden="true">↗</span><span class="activity-title">Обновлена аналитика продаж</span><span class="activity-meta">пример</span></div><div class="activity-row"><span class="activity-icon" aria-hidden="true">▤</span><span class="activity-title">Подготовлен отчёт по рекламе</span><span class="activity-meta">пример</span></div>';
}
function approve(story){
if(confirmation)return;
state.history.push({label:story.approved,time:new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})});
state.history=state.history.slice(-12);state.index=Math.min(stories.length,state.index+1);confirmation=story;save();render();
clearTimeout(confirmationTimer);confirmationTimer=setTimeout(()=>{confirmation=null;render()},1700);
}
$('theme').addEventListener('click',()=>{state.theme=state.theme==='dark'?'light':'dark';save();render()});
$('scenarioInfo').addEventListener('click',()=>popup('Как работает этот сценарий','Мы проектируем будущую главную как для человека, у которого уже подключены почта, календарь и бизнес-данные.\n\nВсе имена, письма, встречи, цифры и действия здесь вымышлены. Согласования сохраняются только в этом браузере: реальные письма не отправляются, календари и финансы не меняются.\n\nВы можете пройти сценарий заново.',true));
$('scenarioRestart').addEventListener('click',()=>{clearTimeout(confirmationTimer);confirmation=null;state.index=0;state.history=[];save();$('info').close();render()});
$('orb').addEventListener('click',()=>{if(confirmation){popup('Решение записано',confirmation.approved+'. Это действие выполнено только в сценарии.');return}const current=stories[state.index];popup(current?current.card:'Управляющий на связи',current?current.detail:'Сейчас нет вопросов, которые требуют вашего решения. В этом сценарии все поручения согласованы.')});
$('ask').addEventListener('submit',e=>{e.preventDefault();const q=$('question').value.trim();if(!q)return;
const v=q.toLowerCase();const current=stories[state.index];
let answer;
if(/письм|клиент|ответ/.test(v))answer=stories[0].detail;
else if(/встреч|календар|расписан/.test(v))answer=stories[1].detail;
else if(/реклам|бюджет|расход|финанс/.test(v))answer=stories[2].detail;
else if(/истори|сделал|выполн|согласов/.test(v))answer=state.history.length?'Последние согласования:\n'+state.history.slice(-5).reverse().map(h=>'✓ '+h.label).join('\n'):'Пока не было согласованных действий. Примерные события показаны ниже на главной.';
else if(/важн|сегодня|задач|дела|срочн/.test(v))answer=current?'Сейчас требует решения: '+current.card+'.\n'+current.subtitle:'Сейчас всё спокойно. В этом сценарии открытых решений нет.';
else answer='В этом прототипе я могу показать письмо, встречу, расходы или историю решений. Свободный разговор и выполнение настоящих поручений появятся после подключения ИИ и ваших сервисов.';
popup('Ответ помощника · сценарий',answer);$('question').value='';
});
$('infoClose').addEventListener('click',()=>$('info').close());
const fab=$('assistantButton'),inputPanel=$('ask'),hint=$('voiceHint');let holdTimer=null,held=false,started=false,recognition=null,suppressClick=false;
let hintTimeout=null;
function setHint(value){hint.textContent=value;hint.classList.add('active');clearTimeout(hintTimeout);hintTimeout=setTimeout(()=>{if(!fab.classList.contains('listening'))hint.classList.remove('active')},value.startsWith('Слушаю')?6000:2800)}
function updateKeyboard(){const v=window.visualViewport;if(!v)return;const shift=Math.max(0,Math.round(window.innerHeight-v.height-v.offsetTop));document.documentElement.style.setProperty('--keyboard-offset',shift+'px')}
if(window.visualViewport){window.visualViewport.addEventListener('resize',updateKeyboard);window.visualViewport.addEventListener('scroll',updateKeyboard)}window.addEventListener('resize',updateKeyboard);updateKeyboard();
function stopVoice(){if(recognition){try{recognition.stop()}catch{}recognition=null}fab.classList.remove('listening')}
function startVoice(){started=true;held=true;const Speech=window.SpeechRecognition||window.webkitSpeechRecognition;if(!Speech){setHint('Распознавание речи недоступно в этом браузере. Нажмите, чтобы написать.');return}try{const sr=new Speech();recognition=sr;sr.lang='ru-RU';sr.interimResults=false;sr.continuous=false;sr.onresult=e=>{const phrase=Array.from(e.results).map(r=>r[0]?.transcript||'').join(' ').trim();if(phrase){inputPanel.hidden=false;$('question').value=phrase;setHint('Речь распознана. Проверьте текст перед отправкой.')}};sr.onerror=e=>setHint('Голосовой ввод: '+(e.error==='not-allowed'?'нет разрешения на микрофон':e.error));sr.onend=()=>{fab.classList.remove('listening');recognition=null};sr.start();fab.classList.add('listening');setHint('Слушаю… отпустите, чтобы закончить')}catch{setHint('Не удалось включить голосовой ввод. Используйте текст.')}} 
fab.addEventListener('pointerdown',e=>{if(e.button!==0)return;started=false;held=false;clearTimeout(holdTimer);holdTimer=setTimeout(startVoice,500)});
function endPress(){clearTimeout(holdTimer);if(held){suppressClick=true;setTimeout(()=>suppressClick=false,350);stopVoice();held=false}}
fab.addEventListener('pointerup',endPress);fab.addEventListener('pointercancel',endPress);fab.addEventListener('pointerleave',endPress);
fab.addEventListener('contextmenu',e=>e.preventDefault());
fab.addEventListener('click',()=>{if(suppressClick||started){started=false;return}inputPanel.hidden=!inputPanel.hidden;if(!inputPanel.hidden){hint.classList.remove('active');requestAnimationFrame(()=>{$('question').focus();updateKeyboard()})}else setHint('Нажмите — написать · удерживайте — говорить')});
$('hideInput').addEventListener('click',()=>{inputPanel.hidden=true;$('question').blur();hint.classList.remove('active')});
render()})();
</script></body></html>
