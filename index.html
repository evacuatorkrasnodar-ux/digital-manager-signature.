<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#090a0c"><meta name="description" content="Живая главная Цифрового управляющего — демонстрация"><title>Цифровой управляющий · Living Interface</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:dark;--bg:#080a0e;--card:#191c23;--card2:#222632;--text:#f6f8fc;--secondary:#9faaba;--line:#353b47;--glass:#e3eefa;--shadow:#0007}
:root[data-theme=light]{color-scheme:light;--bg:#f4f6fa;--card:#fff;--card2:#f2f5f9;--text:#192132;--secondary:#687489;--line:#e3e7ee;--glass:#344a70;--shadow:#8797b226}
*{box-sizing:border-box}html,body{min-height:100%;margin:0;background:var(--bg);color:var(--text)}body{-webkit-font-smoothing:antialiased}.app{max-width:530px;margin:auto;min-height:100dvh;display:flex;flex-direction:column;padding:calc(24px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom))}button{font:inherit;cursor:pointer;color:inherit;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:2px solid #b3c4e7;outline-offset:3px}.top{display:flex;align-items:center;gap:12px}.mark{width:42px;height:42px;display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;font-family:Georgia,serif;font-size:17px;background:var(--card)}.heading{flex:1}h1{font-size:28px;margin:0;font-weight:690;letter-spacing:-.05em}.greeting{font-size:13px;color:var(--secondary);margin:5px 0 0}.round{height:41px;width:41px;background:var(--card);border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;font-size:19px}.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:470px;position:relative}.plasma{width:min(76vw,330px);height:min(76vw,330px);min-height:250px;min-width:250px;position:relative;display:grid;place-items:center;border:0;background:transparent;isolation:isolate;filter:drop-shadow(0 6px 32px #b9ceff2a)}.plasma:before{content:"";position:absolute;inset:8%;border-radius:50%;background:radial-gradient(circle at 42% 28%,#7d8da322 0%,transparent 35%),radial-gradient(circle at center,#0b1120 16%,#27344b44 48%,transparent 65%);box-shadow:inset 0 0 34px #e2ecff4d,0 0 28px #a9c8f72b}.ribbon{position:absolute;inset:15%;border:15px solid #ecf5ffb5;border-left-color:#afc2e95c;border-bottom-color:#f5faffd0;border-radius:52% 48% 64% 36%/42% 58% 36% 64%;box-shadow:inset 0 0 14px #fff8,0 0 22px #dceaff66;transform:rotate(28deg);animation:breathe 9s ease-in-out infinite}.ribbon.b{transform:rotate(92deg) scale(1.12,.79);border-width:10px;border-color:#d6e7ff88;animation-delay:-3s}.ribbon.c{transform:rotate(143deg) scale(.88,1.09);border-width:11px;border-color:#ffffff9b;animation-delay:-6s}.symbol{z-index:2;font-family:Georgia,serif;font-size:31px;letter-spacing:-.06em;color:#f6f9ff;text-shadow:0 1px 15px #d6e6ff9c;transition:opacity .3s}.signal{position:absolute;z-index:3;right:18%;top:22%;width:58px;height:58px;border-radius:19px;background:#e5efffe0;color:#293c60;display:none;place-items:center;box-shadow:0 2px 24px #deeaff9c;font-size:26px}.stage[data-mode=attention] .signal{display:grid}.stage[data-mode=action] .signal{display:grid;font-size:24px}.stage[data-mode=attention] .symbol,.stage[data-mode=action] .symbol{opacity:.65}.stage[data-mode=calm] .plasma{filter:drop-shadow(0 8px 22px #b9ceff16)}.stage[data-mode=calm] .ribbon{opacity:.86}@keyframes breathe{0%,100%{border-radius:52% 48% 64% 36%/42% 58% 36% 64%;scale:1}50%{border-radius:44% 56% 38% 62%/57% 43% 61% 39%;scale:1.035}}.message{text-align:center;width:100%;max-width:380px;margin-top:-4px;min-height:115px}.kicker{font-size:10px;letter-spacing:.16em;color:var(--secondary);text-transform:uppercase}.message h2{font-size:19px;font-weight:660;line-height:1.25;letter-spacing:-.025em;margin:11px 0 7px}.message p{font-size:13px;color:var(--secondary);line-height:1.5;margin:0}.panel{width:100%;background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:0 8px 26px var(--shadow)}.event{padding:16px;margin:10px 0 12px;animation:arrive .25s ease-out}.event-head{display:flex;gap:12px;align-items:center}.event-icon{width:42px;height:42px;flex:none;display:grid;place-items:center;background:var(--card2);border:1px solid var(--line);border-radius:13px;font-size:20px}.event-copy{flex:1}.event-copy strong{display:block;font-size:14px}.event-copy small{display:block;font-size:12px;color:var(--secondary);margin-top:4px}.actions{display:flex;gap:8px;margin-top:15px}.btn{padding:13px 12px;border:1px solid var(--line);background:var(--card2);border-radius:13px;flex:1;font-size:13px;font-weight:600;min-height:45px}.btn.primary{background:#eaf1fb;color:#152032;border-color:#eaf1fb}:root[data-theme=light] .btn.primary{background:#16243a;color:white;border-color:#16243a}.mini{margin-top:12px;text-align:center;font-size:12px;color:var(--secondary)}.prompt{display:flex;gap:10px;margin-top:auto;background:var(--card);border:1px solid var(--line);border-radius:26px;padding:7px 7px 7px 18px;align-items:center}.prompt[hidden]{display:none}.prompt input{flex:1;min-width:0;color:var(--text);background:transparent;border:0;outline:0;font:inherit;font-size:14px}.prompt button{height:40px;width:40px;border:0;border-radius:50%;background:var(--card2)}.dock{position:sticky;bottom:12px;z-index:20;display:grid;grid-template-columns:repeat(2,minmax(0,1fr)) 64px repeat(2,minmax(0,1fr));align-items:center;justify-items:center;gap:0;margin:20px auto 0;width:100%;max-width:470px;min-height:68px;padding:9px 10px;border:1px solid var(--line);border-radius:35px;background:var(--card);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);box-shadow:0 12px 32px var(--shadow)}.nav-item{min-width:0;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;color:var(--secondary);text-align:center;white-space:nowrap}.nav-item b{font-size:23px;font-weight:450;line-height:26px}.dock .active{color:var(--text);font-weight:650}.assistant-button{position:relative;isolation:isolate;overflow:visible;width:64px;height:64px;margin:-21px 0 -4px;padding:0;border-radius:50%;border:1px solid #c8d3df;background:radial-gradient(ellipse at 31% 18%,#eef3f9 0%,#bac8d8 11%,#7b8da4 26%,#374456 46%,#141b26 71%,#0b1019 100%);box-shadow:inset 0 1px 1px #ffffffe3,inset 1px 2px 7px #f5faff60,inset 0 -8px 13px #03060c99,0 0 0 4px var(--card),0 7px 16px #0004;display:grid;place-items:center;touch-action:none;user-select:none;-webkit-user-select:none;transition:transform .14s,box-shadow .15s}
.assistant-button::before{content:"";position:absolute;pointer-events:none;inset:3px;border-radius:50%;border:1px solid #ffffff36;background:linear-gradient(150deg,#f8fcff78 0%,#eaf3ff0d 29%,transparent 55%);mask-image:linear-gradient(#000,#000)}
.assistant-button::after{content:"";position:absolute;pointer-events:none;left:13px;right:13px;top:7px;height:13px;border-radius:50%;background:linear-gradient(#f9fdff88,#e5f1ff08);filter:blur(3px)}
:root[data-theme=light] .assistant-button{border-color:#8997a9;background:radial-gradient(ellipse at 33% 20%,#fff 0%,#e4ebf4 14%,#a9b9ca 34%,#4b5b72 59%,#152035 100%);box-shadow:inset 0 1px 2px #fff,inset 0 -8px 12px #08102090,0 0 0 4px var(--card),0 7px 15px #15233b23}.assistant-button:active{transform:scale(.96)}.assistant-button.listening{box-shadow:inset 0 2px 5px #fff8,0 0 0 4px var(--card),0 0 0 8px #c7d9f255}.assistant-glyph{position:relative;z-index:2;color:#f9fbff;font-size:22px;text-shadow:0 1px 5px #e4f1ff85;line-height:1}.voice-hint{font-size:10px;color:var(--secondary);text-align:center;margin:10px 0 0;min-height:14px}.app{padding-bottom:calc(14px + env(safe-area-inset-bottom))}.demo{margin-top:12px;text-align:center}.demo button{border:0;color:var(--secondary);font-size:11px;padding:10px;background:transparent}.activity{padding:13px 15px;margin-top:10px}.activity strong{font-size:12px}.activity p{margin:6px 0 0;font-size:12px;line-height:1.4;color:var(--secondary)}dialog{width:min(410px,calc(100% - 34px));border:1px solid var(--line);border-radius:20px;background:var(--card);color:var(--text);padding:22px}dialog::backdrop{background:#0009;backdrop-filter:blur(4px)}dialog h2{margin-top:0}dialog p{color:var(--secondary);line-height:1.55;font-size:14px}@keyframes arrive{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}@media(max-height:760px){.stage{min-height:370px}.plasma{width:245px;height:245px;min-width:0;min-height:0}.message{min-height:100px}}
</style></head><body><div class="app"><header class="top"><div class="mark">PW</div><div class="heading"><h1>Мой день</h1><p class="greeting">Доброе утро, Роман</p></div><button id="theme" class="round" aria-label="Переключить тему">◐</button></header><main style="flex:1;display:flex;flex-direction:column"><section id="stage" class="stage" data-mode="attention"><button id="orb" class="plasma" aria-label="Посмотреть сигнал управляющего"><span class="ribbon"></span><span class="ribbon b"></span><span class="ribbon c"></span><span class="symbol">PW</span><span id="signal" class="signal">✉</span></button><div class="message" aria-live="polite"><div id="kicker" class="kicker">Требуется внимание</div><h2 id="headline">Роман, пришло важное письмо</h2><p id="subline">Я подготовил ответ. Осталось ваше согласование.</p></div></section><div id="dynamic"></div><form class="prompt" id="ask" hidden><input id="question" aria-label="Сообщение управляющему" placeholder="Напишите управляющему…" autocomplete="off"><button type="submit" aria-label="Отправить">➤</button><button id="hideInput" type="button" aria-label="Скрыть поле">×</button></form><div class="demo"><button id="demoNext" type="button">Демо: следующее событие ↻</button></div></main><footer class="dock" aria-label="Навигация"><span class="nav-item active"><b>⌂</b>Главная</span><span class="nav-item"><b>☷</b>Дела</span><button type="button" id="assistantButton" class="assistant-button" aria-label="Короткое нажатие — написать, удержание — говорить" aria-describedby="voiceHint"><span class="assistant-glyph" aria-hidden="true">✦</span></button><span class="nav-item"><b>◷</b>История</span><span class="nav-item"><b>⚙</b>Управление</span></footer><div id="voiceHint" class="voice-hint" role="status" aria-live="polite">Нажмите — написать · удерживайте — говорить</div></div><dialog id="info"><h2 id="infoTitle"></h2><p id="infoText"></p><button id="infoClose" class="btn primary">Понятно</button></dialog><script>
(()=>{'use strict';const KEY='dm-signature-living-v1';const $=id=>document.getElementById(id);const stories=[{title:'Роман, пришло важное письмо',text:'Я подготовил ответ. Осталось ваше согласование.',type:'mail',icon:'✉',card:'Письмо от клиента',detail:'Ответ подготовлен в демонстрационном режиме. Реальные письма не подключены.',main:'Согласовать',other:'Посмотреть'},{title:'Встреча через час',text:'Я собрал краткий план разговора.',type:'meeting',icon:'▦',card:'Встреча с клиентом · 10:00',detail:'План встречи подготовлен в демонстрационном режиме. Календарь не подключён.',main:'Принять план',other:'Посмотреть'},{title:'Отчёт готов',text:'Проверил цифры и подготовил краткую сводку.',type:'report',icon:'✓',card:'Отчёт за неделю',detail:'Показатели демонстрационные. Реальные финансы не подключены.',main:'Принять',other:'Посмотреть'}];let state={theme:'dark',index:0,activity:[]};try{const r=JSON.parse(localStorage.getItem(KEY)||'{}');if(r&&typeof r==='object'){state.theme=r.theme==='light'?'light':'dark';state.index=Number.isInteger(r.index)?Math.max(0,Math.min(3,r.index)):0;state.activity=Array.isArray(r.activity)?r.activity.slice(-8).filter(v=>typeof v==='string'):[]}}catch{}const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}};function popup(title,desc){$('infoTitle').textContent=title;$('infoText').textContent=desc;$('info').showModal()}function render(){document.documentElement.dataset.theme=state.theme;const s=stories[state.index];const calm=!s;const action=state.index===2;$('stage').dataset.mode=calm?'calm':action?'action':'attention';$('signal').textContent=calm?'':s.icon;$('kicker').textContent=calm?'Всё спокойно':action?'Работа завершена':'Требуется внимание';$('headline').textContent=calm?'Сейчас ничто не требует вашего решения':s.title;$('subline').textContent=calm?'Я покажу важное, когда оно появится. Данные пока демонстрационные.':s.text;let body='';if(s){body='<article class="panel event"><div class="event-head"><span class="event-icon">'+s.icon+'</span><div class="event-copy"><strong>'+s.card+'</strong><small>'+s.detail+'</small></div></div><div class="actions"><button class="btn" id="inspect" type="button">'+s.other+'</button><button class="btn primary" id="resolve" type="button">'+s.main+'</button></div></article>'}else body='<div class="mini">Завершённые события остались в истории ниже.</div>';if(state.activity.length){body+='<div class="panel activity"><strong>Последние действия</strong><p>'+state.activity.slice(-3).reverse().map(escapeHtml).join('<br>')+'</p></div>'}$('dynamic').innerHTML=body;$('inspect')?.addEventListener('click',()=>popup(s.card,s.detail));$('resolve')?.addEventListener('click',()=>{state.activity.push('✓ '+s.card+' — демонстрационное действие');state.index=Math.min(3,state.index+1);save();render()})}function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}$('theme').addEventListener('click',()=>{state.theme=state.theme==='dark'?'light':'dark';save();render()});$('demoNext').addEventListener('click',()=>{state.index=(state.index+1)%4;save();render()});$('orb').addEventListener('click',()=>{const s=stories[state.index];popup(s?'Живой сигнал':'Управляющий на связи',s?s.detail:'Сейчас нет демонстрационных событий, требующих внимания.')});$('ask').addEventListener('submit',e=>{e.preventDefault();const v=$('question').value.trim();if(!v)return;popup('Вы спросили: '+v,'В этой версии показан интерфейс общения. Настоящий ИИ ещё не подключён.');$('question').value=''});$('infoClose').addEventListener('click',()=>$('info').close());
const fab=$('assistantButton'),inputPanel=$('ask'),hint=$('voiceHint');let holdTimer=null,held=false,started=false,recognition=null,suppressClick=false;
function setHint(value){hint.textContent=value}
function stopVoice(){if(recognition){try{recognition.stop()}catch{}recognition=null}fab.classList.remove('listening')}
function startVoice(){started=true;held=true;const Speech=window.SpeechRecognition||window.webkitSpeechRecognition;if(!Speech){setHint('Распознавание речи недоступно в этом браузере. Нажмите, чтобы написать.');return}try{const sr=new Speech();recognition=sr;sr.lang='ru-RU';sr.interimResults=false;sr.continuous=false;sr.onresult=e=>{const phrase=Array.from(e.results).map(r=>r[0]?.transcript||'').join(' ').trim();if(phrase){inputPanel.hidden=false;$('question').value=phrase;setHint('Речь распознана. Проверьте текст перед отправкой.')}};sr.onerror=e=>setHint('Голосовой ввод: '+(e.error==='not-allowed'?'нет разрешения на микрофон':e.error));sr.onend=()=>{fab.classList.remove('listening');recognition=null};sr.start();fab.classList.add('listening');setHint('Слушаю… отпустите, чтобы закончить')}catch{setHint('Не удалось включить голосовой ввод. Используйте текст.')}} 
fab.addEventListener('pointerdown',e=>{if(e.button!==0)return;started=false;held=false;clearTimeout(holdTimer);holdTimer=setTimeout(startVoice,500)});
function endPress(){clearTimeout(holdTimer);if(held){suppressClick=true;setTimeout(()=>suppressClick=false,350);stopVoice();held=false}}
fab.addEventListener('pointerup',endPress);fab.addEventListener('pointercancel',endPress);fab.addEventListener('pointerleave',endPress);
fab.addEventListener('contextmenu',e=>e.preventDefault());
fab.addEventListener('click',()=>{if(suppressClick||started){started=false;return}inputPanel.hidden=!inputPanel.hidden;if(!inputPanel.hidden){$('question').focus();setHint('Поле для сообщения открыто')}else setHint('Нажмите — написать · удерживайте — говорить')});
$('hideInput').addEventListener('click',()=>{inputPanel.hidden=true;setHint('Нажмите — написать · удерживайте — говорить')});
render()})();
</script></body></html>
