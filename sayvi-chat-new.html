<script>
/* Read the same persisted theme as the SEYVEO Home before first paint. */
(function(){
 const key='dm-signature-living-v2';
 const previous='dm-signature-living-v1';
 const allowed=['auto','graphite','light','dark','sapphire','plum'];
 const browserTheme=window.matchMedia('(prefers-color-scheme: dark)');
 function chosen(){
  let value='graphite';
  try{
   const saved=JSON.parse(localStorage.getItem(key)||'null')
    ||JSON.parse(localStorage.getItem(previous)||'null');
   if(saved&&allowed.includes(saved.theme))value=saved.theme;
  }catch{}
  return value==='auto'?(browserTheme.matches?'graphite':'light'):value;
 }
 function sync(){
  const selected=chosen(),isLight=selected==='light';
  const palette=isLight?'white':selected==='graphite'?'graphite':selected==='sapphire'?'sapphire':selected==='plum'?'plum':'emerald';
  document.documentElement.dataset.theme=isLight?'light':'dark';
  document.documentElement.dataset.palette=palette;
  document.querySelector('meta[name="theme-color"]').content=
   isLight?'#f9fafb':palette==='graphite'?'#11161b':palette==='sapphire'?'#101724':palette==='plum'?'#1c1b1a':'#111917';
 }
 sync();
 window.addEventListener('storage',e=>{if(!e.key||e.key===key||e.key===previous)sync()});
 window.addEventListener('pageshow',sync);
 window.addEventListener('focus',sync);
 document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});
 if(browserTheme.addEventListener)browserTheme.addEventListener('change',sync);
 else if(browserTheme.addListener)browserTheme.addListener(sync);
})();
</script>

/* Same SEYVEO theme system as Home; only colors/materials change.
   No alterations to composer dimensions, behavior or message scrolling. */
:root{
 --sayvi-bg:#11161b;
 --sayvi-scene:linear-gradient(180deg,#0e1419 0%,#141b21 28%,#1b252d 55%,#212d36 78%,#10161b 100%);
 --sayvi-text:#fff;

 /* The backdrop dock subtly unifies the existing separate controls. */

<script>
(()=>{
 'use strict';
 const input=document.getElementById('sayviInput'),list=document.getElementById('sayviMessages');
 // Keep the full-screen scene aligned to the visible viewport on iOS Safari.
 // Only the messages scroll; composer/menu remain anchored to the scene.
 const scene=document.querySelector('main');
 let viewportFrame=0;
 function fitVisibleViewport(){
  if(viewportFrame)return;
  viewportFrame=requestAnimationFrame(()=>{
   viewportFrame=0;
   const vv=window.visualViewport;
   if(vv){
    scene.style.setProperty('--sayvi-viewport-top',vv.offsetTop+'px');
    scene.style.setProperty('--sayvi-viewport-height',vv.height+'px');
   }else{
    scene.style.setProperty('--sayvi-viewport-top','0px');
    scene.style.setProperty('--sayvi-viewport-height',window.innerHeight+'px');
   }
  });
 }
 fitVisibleViewport();
 window.visualViewport?.addEventListener('resize',fitVisibleViewport,{passive:true});
 window.visualViewport?.addEventListener('scroll',fitVisibleViewport,{passive:true});
 window.addEventListener('resize',fitVisibleViewport,{passive:true});
 // Fade older messages only after scrolling; the first visible line stays crisp.
 const updateScrollEdge=()=>list.classList.toggle('is-scrolled',list.scrollTop>2);
 list.addEventListener('scroll',updateScrollEdge,{passive:true});
 const mic=document.getElementById('sayviMic'),sendButton=document.getElementById('sayviSend');
 const stopReplyButton=document.getElementById('sayviStopReply');
 const plus=document.getElementById('sayviPlus'),menu=document.getElementById('sayviMenu');
 const status=document.getElementById('sayviStatus');
 let active=null,sequence=0;
 const historyTurns=[];
 const answers=new Map();
 const storageKey='seyveo.sayvi.conversations.v1';
 let archive=[],currentId='conversation-'+Date.now(),savedTurns=[];
 // In-memory reference for a recent photo in this conversation; never persisted.
 let recentVisual=null;
 // SEYVEO session-only document context v1. No file text in localStorage.
 let recentDocument=null;
 // Latest finished draft for the active chat only. Nothing stored remotely.
 let workingDocument=null;
 // Guided fill is a local, explicit Q&A: no guessed private values.
 let documentFill=null;
 function fillQuestion(label,index,total){
  const clean=String(label||'').trim();
  const prompt=/фамил|имя|отчеств|фио/iu.test(clean)
   ?'Как тебя зовут? Напиши фамилию, имя и отчество — как должно быть в заявлении.'
   :/компан|организац|назван/iu.test(clean)
   ?'Где ты работаешь? Напиши название организации.'
   :/должност/iu.test(clean)
   ?'Какая у тебя должность?'
   :/дат/iu.test(clean)
   ?'Какую дату поставить в заявлении?'
   :'Что написать в документе вместо «'+clean+'»?';
  return 'Заполним документ. Поле '+(index+1)+' из '+total+'.\n'+prompt;
 }
 function startDocumentFill(text){
  const source=String(text||'');
  const fields=documentMissingFields(source);
  if(!fields.length){status.textContent='В этом документе нет незаполненных полей.';return}
  documentFill={conversation:currentId,original:source,text:source,fields,index:0,answers:{}};
  workingDocument={conversation:currentId,text:source};
  append('assistant','fill-'+(++sequence),fillQuestion(fields[0],0,fields.length));
 }
 function handleDocumentFillAnswer(value){
  const state=documentFill;
  if(!state||state.conversation!==currentId)return false;
  const answer=String(value||'').trim();
  if(!answer)return true;
  append('user','fill-user-'+(++sequence),answer);
  if(/^(?:отмена|отмени|стоп|прекрати)$/iu.test(answer)){
   documentFill=null;
   append('assistant','fill-'+(++sequence),'Заполнение остановлено. Исходный документ не изменён.');
   return true;
  }
  if(/^(?:назад|вернись|предыдущий|исправить предыдущий)$/iu.test(answer)){
   if(state.index===0){
    append('assistant','fill-'+(++sequence),'Мы пока на первом вопросе. Как тебя записать в документе?');
   }else{
    state.index--;
    append('assistant','fill-'+(++sequence),'Хорошо, вернёмся. '+fillQuestion(state.fields[state.index],state.index,state.fields.length));
   }
   return true;
  }
  // Natural-language correction of a *previously answered* field, without
  // consuming the current question or guessing any unspecified details.
  const correction=/^(?:нет[,!. ]*|ой[,!. ]*|исправь[,!. ]*|поправь[,!. ]*|я ошибся[,!. ]*)/iu.test(answer)
   || /^(?:фамили[яю]|фио|имя|отчество|организаци[яю]|компани[яю]|название организации|должност[ьи]|дат[ауеы])\s*[:—-]?\s+/iu.test(answer);
  if(correction){
   let kind=null;
   if(/фамили[яю]/iu.test(answer))kind='surname';
   else if(/\bфио\b|имя|отчество/iu.test(answer))kind='fio';
   else if(/организаци|компани|название организации/iu.test(answer))kind='company';
   else if(/должност/iu.test(answer))kind='job';
   else if(/дат[ауеы]/iu.test(answer))kind='date';
   const fieldIndex=state.fields.findIndex((field,i)=>{
    if(!Object.prototype.hasOwnProperty.call(state.answers,field))return false;
    if(kind==='surname'||kind==='fio')return /фамил|имя|отчеств|фио/iu.test(field);
    if(kind==='company')return /компан|организац|назван/iu.test(field);
    if(kind==='job')return /должност/iu.test(field);
    if(kind==='date')return /дат/iu.test(field);
    return false;
   });
   if(fieldIndex>=0){
    const field=state.fields[fieldIndex];
    const previous=state.answers[field];
    const stripped=answer.replace(/^(?:нет[,!. ]*|ой[,!. ]*|исправь[,!. ]*|поправь[,!. ]*|я ошибся[,!. ]*)/iu,'').trim();
    const detail=stripped.replace(/^(?:фамили[яю]|фио|имя|отчество|организаци[яю]|компани[яю]|название организации|должност[ьи]|дат[ауеы])\s*[:—-]?\s*/iu,'')
     .replace(/\s*,?\s+а\s+не\s+.+$/iu,'').replace(/[.!]\s*$/u,'').trim();
    if(!detail||detail.length>180||/[\r\n<>\[\]]/u.test(detail)){
     append('assistant','fill-'+(++sequence),'Что именно нужно исправить? Напиши новое значение.');
     return true;
    }
    let updated=detail;
    if(kind==='surname'){
     const words=String(previous||'').trim().split(/\s+/u).filter(Boolean);
     if(words.length>=2){
      words[0]=detail;updated=words.join(' ');
     }else if(words.length===1){updated=detail}
     else{
      append('assistant','fill-'+(++sequence),'Я ещё не знаю полное ФИО. Напиши фамилию, имя и отчество целиком.');
      return true;
     }
    }
    state.answers[field]=updated;
    state.text=state.original;
    for(const [key,entry] of Object.entries(state.answers)){
     if(entry!==null)state.text=state.text.split('['+key+']').join(entry);
    }
    workingDocument={conversation:currentId,text:state.text};
    append('assistant','fill-'+(++sequence),'Исправила: '+updated+'.\n'+fillQuestion(state.fields[state.index],state.index,state.fields.length));
    return true;
   }
   if(/^(?:нет|ой|я ошибся|исправь|поправь)/iu.test(answer)){
    append('assistant','fill-'+(++sequence),'Что хочешь исправить? Например, напиши: «Фамилия Петров» или «Назад».');
    return true;
   }
  }
  const skipped=/^(?:пропустить|пропусти|не знаю|пока не знаю)$/iu.test(answer);
  if(!skipped&&(answer.length>180||/[\r\n<>\[\]]/u.test(answer))){
   append('assistant','fill-'+(++sequence),'Напиши, пожалуйста, покороче, одной строкой. Или ответь «Пропустить».');
   return true;
  }
  const label=state.fields[state.index];
  state.answers[label]=skipped?null:answer;
  state.text=state.original;
  for(const [field,entry] of Object.entries(state.answers)){
   if(entry!==null)state.text=state.text.split('['+field+']').join(entry);
  }
  state.index++;
  if(state.index<state.fields.length){
   append('assistant','fill-'+(++sequence),fillQuestion(state.fields[state.index],state.index,state.fields.length));
  }else{
   const result=state.text;
   const missing=documentMissingFields(result);
   documentFill=null;
   workingDocument={conversation:currentId,text:result};
   const intro=missing.length?'Я внесла твои ответы. Некоторые поля пока остались пустыми — их можно заполнить позже.':'Готово! Я заполнила заявление.';
   append('assistant','fill-done-'+(++sequence),intro+' Посмотри, всё ли правильно:\n\n---\n'+result+'\n---');
  }
  return true;
 }
 function documentRevisionIntent(question){
  return /(?:исправ|измени|замени|поменя|отредактир|перепиши|добавь|удали|убери|вставь|укажи|поставь|скорректир|переделай|обнови|заполн|подстав|дату|фамилию|имя|отчество|подпись|срок|формулировк)/iu.test(String(question||''));
 }
 function outgoingQuestionWithDocument(question,options){
  if(options.documentFiles?.length||options.attachments?.length)return documentContextFor(question,options);
  if(!workingDocument||workingDocument.conversation!==currentId||!documentRevisionIntent(question))return documentContextFor(question,options);
  const instruction='Ты Сэйви, помощник SEYVEO. Пользователь просит исправить ранее подготовленный документ. Измени только то, что он попросил, сохрани остальные сведения и структуру, не придумывай отсутствующие данные. Выдай ПОЛНУЮ обновлённую версию документа между строками --- и ---, без комментариев в документе. Если изменение непонятно, уточни вопрос.\n\n';
  const tail='\n\nЗапрошенное изменение: '+question;
  const header='Текущий документ:\n---\n',footer='\n---';
  const budget=3900-instruction.length-tail.length-header.length-footer.length;
  if(budget<300)return question;
  if(workingDocument.text.length>budget)return 'Документ слишком длинный для надёжной автоматической правки. Сообщи пользователю, что нужно воспользоваться кнопкой «Посмотреть» → «Редактировать», чтобы ничего не потерять. Запрос: '+question;
  return instruction+header+workingDocument.text+footer+tail;
 }
 function rememberWorkingDocument(text){
  const draft=documentDraftOnly(text);
  if(draft)workingDocument={conversation:currentId,text:draft};
 }
 function documentContextFor(question,options){
  if(options.documentFiles?.length||!recentDocument||recentDocument.conversation!==currentId)return question;
  const entry=recentDocument;
  const prefix='Документ ранее прикреплён в этой беседе: '+entry.names.join(', ')+'. '+
   'Ниже только доступная выдержка; если она неполная, не утверждай, что изучила весь документ. '+
   'Отвечай на вопрос пользователя, не копируй текст целиком.\n\n';
  const suffix='\n\nВопрос пользователя: '+question;
  const budget=3990-prefix.length-suffix.length;
  if(budget<200)return question;
  return prefix+entry.text.slice(0,budget)+suffix;
 }
 function persist(){
  try{localStorage.setItem(storageKey,JSON.stringify({archive:archive.slice(0,40),currentId,turns:savedTurns.slice(-120)}));}
  catch(error){status.textContent='Историю не удалось сохранить на этом устройстве.';}
 }
 function snapshot(){
  return {id:currentId,updated:Date.now(),turns:savedTurns.slice(-120)};
 }
 function renderTurns(turns){
  recentVisual=null;recentDocument=null;workingDocument=null;documentFill=null;
  answers.clear();list.replaceChildren();savedTurns=[];
  for(const turn of turns){
   if(!turn||!['user','assistant'].includes(turn.role)||typeof turn.text!=='string')continue;

 function voicePhrases(text){
  // Keep sentences complete. The private voice endpoint accepts <=450 chars.
  const source=String(text||'').replace(/\s+/gu,' ').trim();
  const units=source.match(/[^.!?…]+(?:[.!?…]+(?=\s|$)|$)/gu)||[source];
  const chunks=[];
  let current='';
  function add(part){
   const p=part.trim();if(!p)return;
   if(current&&current.length+1+p.length>420){chunks.push(current);current=''}
   if(p.length<=420){current=current?current+' '+p:p;return}
   // Rare extra-long sentence: split at word boundaries only.
   for(const word of p.split(/\s+/u)){
    if(!word)continue;
    if(current&&current.length+1+word.length>420){chunks.push(current);current=''}
    if(word.length>420){
     if(current){chunks.push(current);current=''}
     for(let n=0;n<word.length;n+=420)chunks.push(word.slice(n,n+420));
    }else current=current?current+' '+word:word;
   }
  }
  for(const unit of units)add(unit);
  if(current)chunks.push(current);
  return chunks;

  // Backend serializes CPU synthesis, so this never runs multiple models.
  const prepared=new Map();

   if(index>=parts.length)return null;
   if(prepared.has(index))return prepared.get(index);
   const task=(async()=>{
    const response=await fetch('/api/seyveo-private-tts',{
     method:'POST',credentials:'same-origin',
     headers:{'content-type':'application/json'},
     body:JSON.stringify({text:parts[index]}),signal:controller.signal

    if(!response.ok||!(response.headers.get('content-type')||'').includes('audio/wav'))
     throw Error('voice-unavailable');

    // No user-facing loading or "part 1/3" text.

   }
   if(generation===voiceGeneration){stopReplySpeech();feedback.textContent=''}
  }catch(error){

 // Extract only the document draft, leaving Sayvi's conversational framing in chat.
 function documentDraftOnly(value){
  const original=String(value||'').replace(/\r\n?/g,'\n').trim();
  if(!original)return '';
  const lines=original.split('\n');
  const dividers=[];
  for(let i=0;i<lines.length;i++)
   if(/^\s*(?:---+|___+|\*\*\*+)\s*$/.test(lines[i]))dividers.push(i);
  let text='';
  if(dividers.length>=2){
   const section=lines.slice(dividers[0]+1,dividers[1]).join('\n').trim();
   if(section.length>=75)text=section;
  }
  if(!text){
   // A genuine document must have a document heading, not merely mention a document
   // in a conversational prompt such as "Давай я помогу заполнить заявление".
   const title=/^(?:#{1,4}\s*)?(?:\*\*)?(?:Заявление|Договор|Приказ|Акт|Справка|Претензия|Доверенность|Служебная записка|Объяснительная записка|Коммерческое предложение|Уведомление|Письмо|Резюме|Отч[её]т)(?:\*\*)?(?:\s|$|[№:.])/iu;
   const titleIndex=lines.findIndex(line=>title.test(line.trim()));
   if(titleIndex>=0){
    const candidate=lines.slice(titleIndex).join('\n').trim();
    if(candidate.length>=75&&candidate.split('\n').length>=3)text=candidate;
   }
  }
  if(!text)return '';
  text=text.replace(/\n(?:---+|___+)\s*$/u,'').trim();
  text=text.replace(/\n{2,}(?:Если хочешь|Могу (?:также|ещ[её])|Хочешь|При необходимости)[^\n]*(?:\n[^\n]*)*$/iu,'').trim();
  if(text.length<75)return '';
  return text;
 }

 function documentMissingFields(value){
  const text=String(value||'');
  const fields=[...text.matchAll(/\[([^\]\n]{2,80})\]/gu)]
   .map(m=>m[1].trim())

  return [...new Set(fields)].slice(0,8);
 }
 function documentDateWarnings(value){
  const text=String(value||'');
  if(!/отпуск/iu.test(text))return [];
  const warnings=[];
  const months={'января':1,'февраля':2,'марта':3,'апреля':4,'мая':5,'июня':6,'июля':7,'августа':8,'сентября':9,'октября':10,'ноября':11,'декабря':12};
  const found=[];
  const re=/\b(\d{1,2})\s+(января|февраля|марта|апреля|мая|июня|июля|августа|сентября|октября|ноября|декабря)\s+(20\d{2})\s*(?:года|г\.)?/giu;
  for(const match of text.matchAll(re)){
   const day=Number(match[1]),month=months[match[2].toLowerCase()],year=Number(match[3]);
   const date=new Date(Date.UTC(year,month-1,day));
   if(date.getUTCFullYear()===year&&date.getUTCMonth()===month-1&&date.getUTCDate()===day)found.push(date);
  }
  // JS word boundaries do not recognize Cyrillic letters: use a Unicode-aware ending.
  const period=/(?:^|[^\p{L}\p{N}])(\d{1,3})\s+календарн(?:ых|ого|ые)\s+дн(?:ей|я|и)(?![\p{L}\p{N}])/iu.exec(text);
  if(period&&found.length>=2){
   const claimed=Number(period[1]);
   const actual=Math.round((found[1]-found[0])/86400000)+1;
   if(actual<=0)warnings.push('Дата окончания отпуска раньше даты начала.');
   else if(actual!==claimed)warnings.push('В документе указано '+claimed+' календарных дней, но даты дают '+actual+'. Проверь срок отпуска.');
  }

 function suggestDocumentEndDate(value){
  const text=String(value||'');
  if(!/отпуск/iu.test(text))return null;
  const months=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
  const matches=[...text.matchAll(/(\d{1,2})\s+(января|февраля|марта|апреля|мая|июня|июля|августа|сентября|октября|ноября|декабря)\s+(20\d{2})\s*(?:года|г\.)?/giu)];
  if(matches.length!==2)return null;
  const claimed=/(?:^|[^\p{L}\p{N}])(\d{1,3})\s+календарн(?:ых|ого|ые)\s+дн(?:ей|я|и)(?![\p{L}\p{N}])/iu.exec(text);
  if(!claimed)return null;
  const duration=Number(claimed[1]);
  if(duration<1||duration>365)return null;
  const parse=match=>{
   const day=Number(match[1]),month=months.indexOf(match[2].toLowerCase()),year=Number(match[3]);
   const date=new Date(Date.UTC(year,month,day));
   return date.getUTCFullYear()===year&&date.getUTCMonth()===month&&date.getUTCDate()===day?date:null;
  };
  const start=parse(matches[0]),end=parse(matches[1]);
  if(!start||!end)return null;
  const connector=text.slice(matches[0].index+matches[0][0].length,matches[1].index);
  if(!/^\s*(?:года?\s*)?(?:по|до)\s*$/iu.test(connector))return null;
  const expected=new Date(start.getTime()+(duration-1)*86400000);
  if(expected.getTime()===end.getTime())return null;
  const corrected=expected.getUTCDate()+' '+months[expected.getUTCMonth()]+' '+expected.getUTCFullYear()+' года';
  const original=matches[1][0];
  const replacement=original.replace(/\s*(?:года|г\.)?\s*$/iu,'')===original.trim()&&!/год/iu.test(original)?corrected.replace(/ года$/u,''):corrected;
  const offset=matches[1].index;
  return {original:original.trim(),replacement,corrected,
   apply:()=>text.slice(0,offset)+replacement+text.slice(offset+original.length)};
 }
 function printSayviDocument(value,feedback){
  const plain=String(value||'').trim();
  if(!plain){feedback.textContent='Нет текста для печати';return}
  // A blank tab opened directly from the tap also works in most iOS Safari versions.
  const printWindow=window.open('','_blank');
  if(!printWindow){feedback.textContent='Разреши открытие окна для печати';return}
  try{
   const doc=printWindow.document;
   doc.title='SEYVEO — печать документа';
   const meta=doc.createElement('meta');meta.setAttribute('charset','utf-8');doc.head.append(meta);
   const viewport=doc.createElement('meta');viewport.name='viewport';viewport.content='width=device-width, initial-scale=1';doc.head.append(viewport);
   const style=doc.createElement('style');
   style.textContent='@page{size:A4;margin:20mm 18mm}html,body{margin:0;padding:0;background:white;color:#1b1b1b}main{white-space:pre-wrap;overflow-wrap:anywhere;font:12pt/1.55 Georgia,"Times New Roman",serif}@media screen{body{padding:24px;max-width:780px;margin:auto}}@media print{html{-webkit-print-color-adjust:exact;print-color-adjust:exact}main{break-inside:auto}}';
   doc.head.append(style);
   const main=doc.createElement('main');main.textContent=plain;doc.body.append(main);
   printWindow.focus();
   // Run only after the print document has been laid out.
   printWindow.requestAnimationFrame(()=>printWindow.requestAnimationFrame(()=>{
    try{printWindow.print()}catch{feedback.textContent='Не удалось открыть печать. Попробуй снова.'}
   }));
  }catch(error){
   feedback.textContent='Не удалось подготовить печать';
   try{printWindow.close()}catch{}
  }
 }

 function closeOwnActions(){

 function positionOwnPanel(){
  if(!ownBubble||ownSheet.hidden)return;
  const panel=ownSheet.querySelector('.sv-own-panel');
  const host=ownSheet.getBoundingClientRect();
  const anchor=ownBubble.getBoundingClientRect();
  const width=panel.offsetWidth,height=panel.offsetHeight;
  const left=Math.min(Math.max(12,anchor.right-host.left-width),Math.max(12,host.width-width-12));
  const roomAbove=anchor.top-host.top-10;
  const below=anchor.bottom-host.top+8;
  const top=roomAbove>=height+52?roomAbove-height:
   (below+height<=host.height-100?below:Math.max(55,Math.min(roomAbove-height,host.height-height-100)));
  panel.style.left=Math.round(left)+'px';
  panel.style.top=Math.round(Math.max(55,top))+'px';
 }
 function showOwnActions(bubble){

 function modifyOwnMessage(mode){
  if(!ownBubble)return;
  const bubble=ownBubble,turn=bubble.closest('.turn');
  const i=Number(bubble.dataset.savedIndex);
  if(!turn||!Number.isInteger(i)||i<0||i>=savedTurns.length||savedTurns[i].role!=='user')return;
  if(mode==='edit'){
   ownActions.hidden=true;ownEdit.hidden=false;ownText.value=bubble.textContent;positionOwnPanel();ownText.focus();return;
  }
  if(mode==='copy'){

   closeOwnActions();copyReply(value,status);return;
  }
  if(mode==='delete'){
   if(!window.confirm('Удалить это сообщение?'))return;
   savedTurns.splice(i,1);

   closeOwnActions();status.textContent='Сообщение удалено';
  }
 }

 function attachOwnGesture(bubble){
  bubble.addEventListener('contextmenu',event=>{
   event.preventDefault();clearTimeout(ownHoldTimer);
   ownIgnoreClick=true;showOwnActions(bubble);
  });
  bubble.addEventListener('pointerdown',event=>{
   if(event.pointerType==='mouse'&&event.button!==0)return;
   clearTimeout(ownHoldTimer);
   ownPressPoint={x:event.clientX,y:event.clientY,pointerId:event.pointerId};
   ownHoldTimer=setTimeout(()=>{
    ownHoldTimer=null;ownIgnoreClick=true;
    showOwnActions(bubble);
   },500);
  });
  bubble.addEventListener('pointermove',event=>{
   if(!ownPressPoint||ownPressPoint.pointerId!==event.pointerId)return;
   if(Math.abs(event.clientX-ownPressPoint.x)>10||Math.abs(event.clientY-ownPressPoint.y)>10){
    clearTimeout(ownHoldTimer);ownHoldTimer=null;
   }
  });
  for(const type of ['pointerup','pointercancel','pointerleave']){
   bubble.addEventListener(type,()=>{clearTimeout(ownHoldTimer);ownHoldTimer=null;ownPressPoint=null});
  }
  bubble.addEventListener('click',event=>{
   if(ownIgnoreClick){event.preventDefault();ownIgnoreClick=false}
  });
 }

 function renderAssistantText(bubble,source){
  const fragment=document.createDocumentFragment();
  const lines=String(source).split('\n');
  lines.forEach((raw,index)=>{
   if(index)fragment.append(document.createTextNode('\n'));
   const line=raw.replace(/^(\s{0,3})#{1,4}\s+/u,'$1')
    .replace(/^(\s{0,3})[-*+]\s+(?=\S)/u,'$1• ');
   const pattern=/\*\*([^*\n]+)\*\*/gu;
   let cursor=0,match;
   while((match=pattern.exec(line))){
    if(match.index>cursor)fragment.append(document.createTextNode(line.slice(cursor,match.index)));
    const strong=document.createElement('strong');
    strong.textContent=match[1];fragment.append(strong);
    cursor=pattern.lastIndex;
   }
   if(cursor<line.length)fragment.append(document.createTextNode(line.slice(cursor)));
  });
  bubble.replaceChildren(fragment);
 }

 function isReadableText(file){return readableTextTypes.test(file.type)||readableExtensions.test(file.name)}
 async function prepareAttachments(items,textBudget=3200){
  const segments=[],uploaded=[];
  let remaining=Math.max(0,textBudget);
  const documentType=/\.(?:pdf|docx|xlsx|pptx)$/iu;
  for(const entry of items){
   const file=entry.file;
   if(isReadableText(file)||documentType.test(file.name)){
    if(remaining<180)throw Error('Слишком много вложений для одного вопроса. Пришли файлы по одному.');
    let content='',alreadyTruncated=false;
    if(isReadableText(file)){
     if(file.size>100000)throw Error('Текстовый файл '+file.name+' слишком большой (максимум 100 КБ).');
     content=await file.text();
    }else{
     const form=new FormData();form.append('file',file,file.name);
     let response;
     try{response=await fetch('/api/seyveo-document-text',{method:'POST',credentials:'same-origin',body:form})}
     catch{throw Error('Локальный обработчик документов недоступен.')}
     if(!response.ok){
      const detail=await response.json().catch(()=>null);
      throw Error((typeof detail?.error==='string'?detail.error:'Не удалось прочитать документ.')+' Файл остался выбранным.');
     }
     const result=await response.json().catch(()=>null);
     if(typeof result?.text!=='string'||!result.text.trim())throw Error('В документе не найден текст.');
     content=result.text;alreadyTruncated=result.truncated===true;
    }
    const header='Файл: '+file.name+'\n--- ВЫДЕРЖКА ИЗ ДОКУМЕНТА ---\n';
    const available=remaining-header.length-90;
    if(available<100)throw Error('Недостаточно места для документа. Пришли его отдельно.');
    const excerpt=content.slice(0,available);
    const limited=alreadyTruncated||content.length>available;
    const segment=header+excerpt+(limited?'\n[Текст документа показан не полностью.]':'')+'\n--- КОНЕЦ ВЫДЕРЖКИ ---';
    segments.push(segment);
    remaining-=segment.length;
   }else{
    // Images use their original temporary visual route.
    const supportedImage=/^image\/(?:png|jpeg|webp)$/i.test(file.type);
    if(!supportedImage){
     const ext=(file.name.split('.').pop()||'').toUpperCase();
     throw Error('Формат '+(ext||'файла')+' пока не поддерживается. Выбери PDF, DOCX, XLSX, PPTX, текст или PNG/JPG/WebP.');
    }
    const body=new FormData();body.append('file',file,file.name);
    let response;
    try{response=await fetch('/api/seyveo-attachments',{method:'POST',credentials:'same-origin',body})}
    catch{throw Error('Сервер загрузки файлов сейчас недоступен. Вложение не отправлено.')}
    if(!response.ok){
     const errorData=await response.json().catch(()=>null);
     throw Error((typeof errorData?.error==='string'?errorData.error:'Не удалось загрузить файл (код '+response.status+').')+' Вложение осталось здесь.');
    }
    const info=await response.json().catch(()=>null);
    if(!info||typeof info.id!=='string'||!info.id.trim())throw Error('Сервер не подтвердил загрузку '+file.name+'. Вложение не отправлено.');
    uploaded.push({id:info.id,name:file.name,type:file.type||'application/octet-stream',size:file.size});
   }
  }
  return {segments,uploaded};
 }

 // Restored conversations can include consecutive user turns and edited/deleted
 // messages. Build a clean bounded context without changing visible history.
 function validStreamHistory(){
  const pairs=[];
  let waiting=null;
  for(const turn of historyTurns){
   if(!turn||typeof turn.content!=='string')continue;
   const text=turn.content.trim().slice(0,650);
   if(!text)continue;
   if(turn.role==='user'){waiting={role:'user',content:text}}
   else if(turn.role==='assistant'&&waiting){
    pairs.push(waiting,{role:'assistant',content:text});
    waiting=null;
   }
  }
  let selected=pairs.slice(-6);
  while(selected.length&&selected.reduce((sum,t)=>sum+t.content.length,0)>2400)selected=selected.slice(2);
  return selected;

 function knowledgeIntent(message){
  const text=String(message).trim().replace(/^(?:сэй|сэйви)[,\s!]+/iu,'');
  if(/^(?:память|покажи память|что ты помнишь|моя память)\??$/iu.test(text))return {type:'list-memory'};
  let m=/^(?:забудь|удали из памяти)\s+(\d{1,2})\s*[.!]?$/iu.exec(text);
  if(m)return {type:'delete-memory',index:Number(m[1])-1};
  if(/^(?:очисти память|удали всю память)\s*[.!]?$/iu.test(text))return {type:'clear-memory'};
  if(/^(?:обучение|покажи обучение|лаборатория обучения)\??$/iu.test(text))return {type:'list-learning'};
  m=/^(?:научи(?:сь)?|предложи обучение)\s*[:：]\s*([\s\S]+?)\s*(?:=>|⇒|\|)\s*([\s\S]+)$/iu.exec(text);
  if(m)return {type:'propose',question:m[1].trim(),answer:m[2].trim()};
  m=/^(?:одобри|подтверди|отклони)\s+(?:пример\s+)?(\d{1,2})\s*[.!]?$/iu.exec(text);
  if(m)return {type:/^отклони/iu.test(text)?'reject':'approve',index:Number(m[1])-1};
  return null;

 async function ask(question,options={}){
  if(!options.skipUser&&!options.attachments?.length){
   const cardAction=window.SEYVEO_CARD_VOICE?.handle(question);

   }
  }
  const intent=options.skipUser?null:knowledgeIntent(question);
  if(intent&&!options.attachments?.length)return runKnowledgeCommand(question,intent);
  const query=options.skipUser?'':webRequest(question);
  if(query&&!options.attachments?.length)return searchInChat(question,query);

   append('user','user-'+id,options.displayMessage??question,true,options.previewPhotos,options.previewFiles);
   const sentTurn=answers.get('user-'+id)?.closest('.turn');
   if(sentTurn&&Array.isArray(options.documentFiles)){
    sentDocumentBlobs.set(sentTurn,options.documentFiles);

   }
  }
  let answer='',done=false,wasTruncated=false,streamingTurn=null;
  const thinkingStarted=performance.now();
  const stopThinking=showThinking();
  async function finishThinking(){
   const remaining=900-(performance.now()-thinkingStarted);
   if(remaining>0&&!controller.signal.aborted)await new Promise(resolve=>setTimeout(resolve,remaining));
   stopThinking();
  }
  function revealAnswer(text){
   if(!streamingTurn){
    stopThinking();
    append('assistant',replyId,text);
    streamingTurn=answers.get(replyId)?.closest('.turn');
    if(streamingTurn){
     streamingTurn.classList.add('is-streaming','is-fresh');
     setTimeout(()=>streamingTurn?.classList.remove('is-fresh'),320);
    }
   }else append('assistant',replyId,text);
  }
  try{
   const response=await fetch('/api/seyveo-stream',{
    method:'POST',credentials:'same-origin',
    headers:{'content-type':'application/json'},
    body:JSON.stringify({message:outgoingQuestionWithDocument(question,options),history:validStreamHistory(),...(linkedPhotos.length?{attachments:linkedPhotos}:{})}),
    signal:controller.signal
   });
   if(!response.ok){
    if(response.status===404||response.status===405)throw Error('Для живых ответов Сэйви нужно подключение сервера ИИ. На GitHub Pages он недоступен.');
    const body=await response.json().catch(()=>({}));

   if(!response.body)throw Error('Браузер не поддерживает потоковые ответы.');

   let buffer='';
   function consume(line){
    if(!line.trim())return;
    const part=JSON.parse(line);
    if(part.type==='delta'&&typeof part.text==='string'){
     answer+=part.text;revealAnswer(answer);
    }else if(part.type==='done'){done=true;wasTruncated=part.truncated===true;}
    else if(part.type==='error')throw Error(part.text||'Ошибка ответа Сэйви.');
   }
   while(true){
    const chunk=await reader.read();
    if(chunk.done)break;
    buffer+=decoder.decode(chunk.value,{stream:true});
    let n;
    while((n=buffer.indexOf('\n'))!==-1){
     consume(buffer.slice(0,n));buffer=buffer.slice(n+1);
    }
   }
   buffer+=decoder.decode();
   if(buffer.trim())consume(buffer);
   if(!done)throw Error('Соединение прервалось.');
   if(!answer.trim())throw Error('Сэйви не прислала ответ.');
   if(wasTruncated)status.textContent='Ответ ограничен моделью. Напиши «продолжи», чтобы Сэйви закончила мысль.';
   else rememberWorkingDocument(answer);
   historyTurns.push({role:'user',content:question.slice(0,250)},{role:'assistant',content:answer.slice(0,450)});
   if(historyTurns.length>12)historyTurns.splice(0,historyTurns.length-12);
  }catch(error){
   if(!controller.signal.aborted){
    status.textContent=String(error?.message||'Ошибка соединения.');
    if(answer)revealAnswer(answer);
   }
  }finally{
   streamingTurn?.classList.remove('is-streaming','is-fresh');
