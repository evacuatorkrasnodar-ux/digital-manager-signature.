name: SEYVEO Android test APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Expo authentication secret
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add EXPO_TOKEN to repository Actions secrets before starting APK build."
            exit 1
          fi
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate TypeScript
        run: npm run check
      - name: Request preview Android APK build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CI: '1'
        run: npx eas-cli@latest build --platform android --profile preview --non-interactive --no-wait
