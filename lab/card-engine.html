<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SEYVEO · Card Engine Lab</title><style>
:root{color-scheme:dark;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#101916;color:#f3f9f6}*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#18372b 0%,#101916 63%)}main{max-width:540px;margin:auto;padding:24px 18px 72px}
small,.sub{color:#a7bdb4}.top{display:flex;align-items:center;justify-content:space-between;gap:16px}.top a{color:#c5ecdb;text-decoration:none}h1{font-size:24px;font-weight:550;letter-spacing:.09em;margin:12px 0 0}h2{font-size:18px;margin:0 0 8px}p{margin:0 0 12px}
.note{border:1px solid #37594b;border-radius:16px;padding:12px;margin:20px 0;color:#b8cdc2;font-size:13px}
.card{background:linear-gradient(145deg,#22342c,#182620);border:1px solid #426452;border-radius:22px;margin:14px 0;padding:19px;box-shadow:0 10px 28px #0002}.card[data-type=document]{border-color:#6b798a}.card[data-type=task]{border-color:#8d7b62}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#9dcab4}.section{border-top:1px solid #ffffff16;padding-top:12px;margin-top:12px}.section small{display:block;margin-bottom:4px}.proposal{color:#c6e7d4}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:18px}button{font:inherit;cursor:pointer;border:1px solid #6b927e;background:transparent;color:#e7f8ec;border-radius:999px;padding:10px 17px;min-height:44px}button.primary{background:#b8e1cb;color:#153327;border:0}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}#log{white-space:pre-wrap;border:1px solid #375144;border-radius:16px;padding:14px;font:12px/1.6 ui-monospace,monospace;max-height:280px;overflow:auto;color:#c1d2c8}#status{min-height:24px;color:#c3e8d4} .empty{text-align:center;color:#b2d3bf;padding:28px}.tag{font-size:11px;color:#aac7b9}
</style></head><body><main><div class="top"><span class="eyebrow">SEYVEO · Developer Lab</span><a href="../index.html">Вернуться в приложение</a></div><h1>Живые карточки</h1><p class="sub">Card Engine V1 · изолированная демонстрация</p><div class="note">Это тестовый экран. Отправка писем, подписи и реальные поручения здесь не выполняются. Кнопка «Успех» имитирует подтверждение внешнего сервиса.</div><div class="toolbar"><button id="reset" class="primary">Восстановить три карточки</button><button id="duplicate">Проверить повтор события</button><button id="restore">Вернуть отложенные</button></div><p id="status" role="status" aria-live="polite"></p><div id="cards"></div><h2>Журнал разработчика</h2><div id="log" aria-live="polite">Запуск демо…</div></main>
<script type="module">
import {createDemoEvents,ingest,transition,visible,actionFor} from '../assets/seyveo-card-engine.mjs';
const scope={accountId:'demo-account',workspaceId:'demo-workspace'},events=createDemoEvents(),list=document.querySelector('#cards'),log=document.querySelector('#log'),status=document.querySelector('#status');let cards=[];
const entries=[];function record(s){entries.unshift(new Date().toLocaleTimeString('ru-RU')+'  '+s);log.textContent=entries.slice(0,30).join('\n');}
function text(tag,value,cls){const el=document.createElement(tag);if(cls)el.className=cls;el.textContent=value;return el;}
function setCard(c){cards=cards.map(x=>x.id===c.id?c:x);render();}
function move(c,to,meta){const n=transition(c,to,meta);record(c.cardType+' · '+c.status+' → '+to);setCard(n);return n;}
function render(){list.replaceChildren();const queue=visible(cards);if(!queue.length){list.append(text('p','Все карточки обработаны.','empty'));return;}queue.forEach(c=>{const article=text('article','','card');article.dataset.type=c.cardType;article.append(text('div','SEYVEO · '+c.sourceLabel+' · ДЕМО','eyebrow'),text('h2',c.title),text('div',c.actorLabel,'tag'));for(const [label,value] of [['Событие',c.contextText],['Сэйви',c.assistantText],['Предложение',c.proposalText]]){if(!value)continue;const sec=text('div','','section');sec.append(text('small',label),text('p',value,label==='Предложение'?'proposal':''));article.append(sec);}const row=text('div','','actions');if(c.status==='failed')row.append(makeButton('Повторить',()=>{let n=move(c,'action_pending');move(n,'executing');},true));else if(c.status==='executing'){row.append(makeButton('Успех · демо',()=>{let n=move(c,'succeeded',{acknowledged:true,reason:'SIMULATED ACK'});move(n,'archived');status.textContent='Демо: действие подтверждено. Карточка перемещена в историю.';},true),makeButton('Ошибка · демо',()=>{move(c,'failed',{reason:'SIMULATED ERROR'});status.textContent='Демо: ошибка исполнения, карточка осталась.';}));}else if(c.status==='shown'){c.actions.forEach(a=>row.append(makeButton(a.label,()=>{actionFor(c,a.id);if(a.id==='chat'){status.textContent='Демо: переход в чат. Карточка остаётся активной.';record('open chat: '+c.id);return;}let n=move(c,'action_pending');move(n,'executing');status.textContent='Демо: действие ожидает подтверждения результата.';},a.id!=='chat')));row.append(makeButton('Позже',()=>{move(c,'deferred');status.textContent='Карточка отложена, но не завершена.';}));}if(c.status==='action_pending')row.append(text('span','Ожидается запуск…','sub'));article.append(row);list.append(article);});}
function moveWithoutRender(c,next){const n=transition(c,next);cards=cards.map(x=>x.id===c.id?n:x);record(c.cardType+' · '+c.status+' → '+next);}
function makeButton(label,fn,primary=false){const b=text('button',label,primary?'primary':'');b.type='button';b.addEventListener('click',fn);return b;}
function reset(){cards=ingest(events,scope).map(c=>transition(c,'shown'));status.textContent='Три демонстрационных события получены.';record('ingest: '+cards.length+' cards');render();}
document.querySelector('#restore').addEventListener('click',()=>{const waiting=cards.filter(c=>c.status==='deferred');waiting.forEach(c=>{const n=transition(c,'shown');cards=cards.map(x=>x.id===n.id?n:x);record('resume: '+n.eventId);});status.textContent='Возвращено отложенных карточек: '+waiting.length;render();});document.querySelector('#reset').addEventListener('click',reset);document.querySelector('#duplicate').addEventListener('click',()=>{const check=ingest([...events,events[0]],scope);status.textContent='Получено 4 события, уникальных карточек: '+check.length+'.';record('dedup: 4 events → '+check.length+' cards');});reset();
</script></body></html>
